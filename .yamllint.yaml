# The canonical config. `.github/.yamllint.yaml` is a copy of this file, so the org's reusable
# workflows and the monorepo lint identically — a rule that differs between them shows up as a
# workflow that passes in one repository and fails in the other, with no diff explaining it.
extends: default

# Lint what the repository owns, which is what .gitignore already defines. Without this,
# `yamllint --strict .` — the command the presubmit lane runs and the one CONTRIBUTING tells a
# developer to run — walks .venv and reports 666 findings from PyTorch's packaged YAML. It
# passes in CI only because a fresh runner has no .venv or .direnv yet, so the lane and the
# laptop disagree about a command that is supposed to be identical in both.
ignore-from-file: .gitignore

rules:
  # pnpm 11 treats a YAML document marker as an empty lockfile, so its generated lock is the
  # sole YAML document that cannot carry the repository-wide `---` marker.
  document-start:
    present: true
    ignore: |
      pnpm-lock.yaml
  line-length: disable
  # The Kubernetes manifests use spaced flow mappings — `{ type: RuntimeDefault }` — which is
  # a deliberate readability choice and not a defect. yamllint's default forbids the inner
  # spaces outright; this permits exactly one, so `{  type: x  }` is still an error.
  braces:
    max-spaces-inside: 1
  truthy:
    allowed-values: ["true", "false", "on"]
