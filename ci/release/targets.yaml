#
# Closed target catalog. A release request selects a name; it cannot inject commands, labels,
# registry locations, attestors, or service accounts.
schemaVersion: 2
targets:
  go-vanity:
    releaseKind: application
    application: platform-go-vanity
    rolloutClass: stateless
    images:
      primary:
        repository: releases/go-vanity
        buildTarget: //services/go_vanity:image
        pushTarget: //services/go_vanity:push
    artifacts: []
    qualificationMode: test
    qualificationTargets:
      - //services/go_vanity/...
  protobuf-contracts:
    releaseKind: bundle
    application: platform-protobuf-contracts
    rolloutClass: platform
    images:
      primary:
        repository: releases/protobuf-contracts
        buildTarget: //protocols:protobuf_contract_image
        pushTarget: //protocols:protobuf_contract_push
    artifacts: []
    qualificationMode: test
    qualificationTargets:
      - //protocols:protobuf_governance_test
      - //protocols:typescript_projection_test
      - //protocols/consumers:generated_go_test
  weights-fixture:
    releaseKind: model
    application: research-weights-fixture
    rolloutClass: model-bundle
    images:
      primary:
        repository: releases/weights-fixture
        buildTarget: //models/reference/weights_fixture:fixture_image
        pushTarget: //models/reference/weights_fixture:fixture_push
    artifacts: []
    qualificationMode: build
    qualificationTargets:
      - //models/reference/weights_fixture:fixture_image
