# ---------------------------------------------------------------------------------------
# Reserved-but-unimplemented domains
# ---------------------------------------------------------------------------------------
# Registered so the maturity gate can see them. An unregistered path is neither pass nor
# fail — it is invisible, which is the one state ADR-0021 has no answer for. Each entry
# below is `scaffolded` because its non-test sources declare zero functions or classes and
# its BUILD.bazel is the scaffold `filegroup`; that is materialized space, not capability.

[[component]]
name = "evaluation"
path = "evaluation"
status = "scaffolded"
owner = "training-platform"

[[component]]
name = "kernels"
path = "kernels"
status = "scaffolded"
owner = "biology-ml"

# The `data` umbrella, not `data/curation`. Curation is the one implemented package in this
# tree and stays declared separately above as `data.curation`; everything else under `data/`
# — connectors, contracts, datasets, ingestion, loaders, quality, reference, tokenizers and
# the root modules — is reserved space.
[[component]]
name = "data"
path = "data"
status = "scaffolded"
owner = "data-platform"

