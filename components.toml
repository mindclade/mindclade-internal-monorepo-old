# ---------------------------------------------------------------------------------------
# control/ domains that held production Go while unregistered
# ---------------------------------------------------------------------------------------
# These three carried 1,562 lines of non-scaffold Go with no entry here, which is the one
# state the maturity model has no answer for: every rule in maturity.toml is a rule about a
# DECLARED component, so "production may not depend on planned/scaffolded/experimental" simply
# did not apply to them. Registering them changes no code and advances nothing; the statuses
# below are what the tree already proves and no more. `check_component_maturity.py` now fails
# when a control/ or libs/ package with non-scaffold production Go has no entry, so the same
# omission cannot recur silently.
#
# The other sixteen undeclared control/ directories — audit, evaluations, events, metadata,
# registry (root), registry/datasets, registry/deployments, runs, scheduling, tenancy, usage,
# webhooks, weights, and the ingestion/orchestration/scheduling adapter leaves — hold zero
# non-scaffold production lines between them. They stay undeclared on purpose: a file whose
# whole body is `const scaffold_<name> = "<path>"` is reserved space, not a component, and
# declaring it would put a status on something that has nothing to have a status about.

# Signed production-eligibility decisions: sealed control policy, claim/verification history
# with digest and policy-epoch binding, and revocation. `implemented` and not `qualified` —
# it has owning tests and a real go_library, but no qualification evidence document. Its six
# tests are substantive, including canonical golden digests for policy, claim, verification
# and decision, which is what makes the GitOps projection's vectors falsifiable.
[[component]]
name = "control.evidence"
path = "control/evidence"
status = "implemented"
owner = "platform-control"
tests = ["control/evidence/service_test.go"]
runbook = "docs/runbooks/control-evidence.md"

# Release-lineage graphs: order-independent digests, cycle rejection, connected-evidence
# requirements, and classification-aware projection that withholds restricted nodes and the
# edges touching them. `implemented` on the same footing as control.reference_databases —
# one owning test file, four tests, all exercising real behaviour rather than construction.
[[component]]
name = "control.lineage"
path = "control/lineage"
status = "implemented"
owner = "platform-control"
tests = ["control/lineage/lineage_test.go"]
runbook = "docs/runbooks/control-lineage.md"

