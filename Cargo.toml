[workspace]
resolver = "3"
members = [
    "libs/rust/artifact_cas",
    "libs/rust/atomic_fs",
    "libs/rust/bio_formats",
    "libs/rust/bounded_parse",
    "libs/rust/bytes_io",
    "libs/rust/checkpoint_io",
    "libs/rust/content_digest",
    "libs/rust/data_stream",
    "libs/rust/faults",
    "libs/rust/gpu_host",
    "libs/rust/identifiers",
    "libs/rust/ipc",
    "libs/rust/ipc_os",
    "libs/rust/manifests",
    "libs/rust/object_store",
    "libs/rust/process_os",
    "libs/rust/python_bridge",
    "libs/rust/record_io",
    "libs/rust/runtime_core",
    "libs/rust/servicekit",
    "libs/rust/telemetry",
    "libs/rust/telemetry_spool",
    "libs/rust/tokenizer_runtime",
    "libs/rust/worker_protocol",
    "libs/rust/worker_runtime",
    "serving/runtime",
    "services/artifact_proxy",
	"services/ai_gateway_proxy",
    "services/node_agent",
    "services/runtime_gateway",
    "services/runtime_host",
    "services/workers/ingestion",
    "protocols/rust",
    "tools/qualification/rust/perf_probe",
]


[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "json", "tokio"] }
base64 = "=0.22.1"
bytes = "=1.12.1"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc", "pkcs8"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
futures-util = "=0.3.34"
libc = "=0.2.183"
object_store = { version = "=0.14.1", default-features = false, features = ["aws", "gcp", "http"] }
prost = "=0.14.4"
prost-types = "=0.14.4"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
protoc-bin-vendored = "=3.2.0"
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "=0.1.17", features = ["net"] }
tonic = { version = "=0.14.6", features = ["transport"] }
tonic-prost = "=0.14.6"
tonic-prost-build = "=0.14.6"
tower = { version = "=0.5.3", features = ["limit", "load-shed", "timeout", "util"] }

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "LicenseRef-Mindclade-Proprietary"
repository = "https://github.com/Mindclade/mindclade-internal-monorepo"
authors = ["Mindclade Engineering"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Public fallible APIs share the workspace `Fault` taxonomy and are documented
# at module/contract level. Repeating a boilerplate `# Errors` section on every
# adapter method obscures the stable error model without improving safety.
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
