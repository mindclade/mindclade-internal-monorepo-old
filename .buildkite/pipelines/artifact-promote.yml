#
# Identity canary only. This pipeline cannot copy images, change GitOps, or create deployment
# attestations; the protected GitHub release environment owns the independent signer path.
checkout:
  commit_verification: strict

steps:
  - label: ":no_entry: promotion WIF rejects an untrusted step"
    key: artifact-promote-wif-denied
    branches: main
    agents:
      queue: mindclade-artifact-private
    timeout_in_minutes: 10
    command: .buildkite/scripts/wif-preflight.sh promotion denied
    artifact_paths:
      - .buildkite-evidence/wif-promotion-denied.json

  - wait

  - label: ":closed_lock_with_key: promotion WIF accepts the exact contract"
    key: artifact-promote
    branches: main
    agents:
      queue: mindclade-artifact-private
    timeout_in_minutes: 10
    command: .buildkite/scripts/wif-preflight.sh promotion allowed
    artifact_paths:
      - .buildkite-evidence/wif-promotion-allowed.json
