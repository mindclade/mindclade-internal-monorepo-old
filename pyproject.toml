[project]
name = "mindclade-internal"
version = "0.0.0"
description = "Mindclade internal monorepo for biomolecular data, training, evaluation, and inference"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests", "data", "evaluation", "kernels", "models", "preprocessing", "serving", "training"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["research/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
exclude = ["research/notebooks"]
