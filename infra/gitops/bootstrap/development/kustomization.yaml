---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A cluster selects exactly one of these roots. Combining environment roots would target
# multiple environment contracts at the same in-cluster API server and is forbidden.
resources:
  - ../../argocd
  - ../../environments/development/applications
