---
# Byte-level lock for remote bootstrap content. This standard ConfigMap is intentionally data,
# not a custom resource with no controller. Offline validation checks its shape; a connected,
# controlled bootstrap must fetch the URL, compare bytes and SHA-256, and fail on any mismatch.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mindclade-upstream-content-lock
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-29"
    mindclade.dev/activation-state: blocked
data:
  schema.version: "1"
  cert-manager.name: cert-manager
  cert-manager.version: v1.19.1
  cert-manager.url: https://github.com/cert-manager/cert-manager/releases/download/v1.19.1/cert-manager.yaml
  cert-manager.sha256: 876a41a57e36b85619f4124b24b3deb80912b5ffed515f90e2f160b6e6338e81
  cert-manager.bytes: "1007958"
  cert-manager.sync-wave: "-30"
  argocd.installation-state: blocked-until-live-repository-supplies-exact-chart-lock
  jobset.chart-lock: infra/kubernetes/platform/jobset/chart/Chart.lock
  kueue.chart-lock: infra/kubernetes/platform/kueue/chart/Chart.lock
