---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mindclade-bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
    mindclade.dev/activation-state: blocked
spec:
  description: Self-management boundary for Mindclade Argo CD source contracts
  sourceRepos:
    - https://github.com/mindclade-org/mindclade.git
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: argoproj.io
      kind: Application
  orphanedResources:
    warn: true
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mindclade-foundation
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
    mindclade.dev/activation-state: blocked
spec:
  description: Fail-closed Mindclade namespace, admission, and resource-policy foundation
  sourceRepos:
    - https://github.com/mindclade-org/mindclade.git
  destinations:
    - namespace: mindclade-system
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
    - group: scheduling.k8s.io
      kind: PriorityClass
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: LimitRange
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: ServiceAccount
    - group: networking.k8s.io
      kind: NetworkPolicy
  orphanedResources:
    warn: true
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mindclade-operators
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
    mindclade.dev/activation-state: blocked
spec:
  description: Kueue and JobSet CRDs and controllers from repository-locked Helm wrappers
  sourceRepos:
    - https://github.com/mindclade-org/mindclade.git
  destinations:
    - namespace: jobset-system
      server: https://kubernetes.default.svc
    - namespace: kueue-system
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: apiregistration.k8s.io
      kind: APIService
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: cert-manager.io
      kind: Certificate
    - group: cert-manager.io
      kind: Issuer
    - group: policy
      kind: PodDisruptionBudget
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
  orphanedResources:
    warn: true
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mindclade-ml-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
    mindclade.dev/activation-state: blocked
spec:
  description: Held queue resources and suspended JobSet compatibility canary
  sourceRepos:
    - https://github.com/mindclade-org/mindclade.git
  destinations:
    - namespace: mindclade-system
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: kueue.x-k8s.io
      kind: ClusterQueue
    - group: kueue.x-k8s.io
      kind: ResourceFlavor
  namespaceResourceWhitelist:
    - group: jobset.x-k8s.io
      kind: JobSet
    - group: kueue.x-k8s.io
      kind: LocalQueue
  orphanedResources:
    warn: true
