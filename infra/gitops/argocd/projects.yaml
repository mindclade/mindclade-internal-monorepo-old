---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mindclade-bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
    mindclade.dev/activation-state: blocked
spec:
  description: Self-management boundary for Mindclade Argo CD source contracts
  sourceRepos:
    - https://github.com/mindclade-org/mindclade.git
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: argoproj.io
      kind: Application
  orphanedResources:
    warn: true
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mindclade-foundation
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
    mindclade.dev/activation-state: blocked
spec:
  description: Fail-closed Mindclade namespace, admission, and resource-policy foundation
  sourceRepos:
    - https://github.com/mindclade-org/mindclade.git
  destinations:
    - namespace: mindclade-batch-cpu
      server: https://kubernetes.default.svc
    - namespace: mindclade-system
      server: https://kubernetes.default.svc
    - namespace: mindclade-training-h100
      server: https://kubernetes.default.svc
    - namespace: mindclade-training-h200
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
    - group: scheduling.k8s.io
      kind: PriorityClass
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: LimitRange
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: ServiceAccount
    - group: networking.k8s.io
      kind: NetworkPolicy
  orphanedResources:
    warn: true
---
