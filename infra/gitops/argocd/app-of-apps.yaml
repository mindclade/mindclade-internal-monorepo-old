---
# Manual bootstrap template. It is inert until a controlled live overlay selects exactly one
# environment, supplies an immutable commit SHA, and removes skip-reconcile after review.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mindclade-bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/skip-reconcile: "true"
    argocd.argoproj.io/sync-wave: "-40"
    mindclade.dev/activation-state: blocked
    mindclade.dev/revision-state: placeholder
spec:
  project: mindclade-bootstrap
  source:
    repoURL: https://github.com/mindclade-org/mindclade.git
    targetRevision: SET_EXACT_40_CHAR_COMMIT_SHA
    path: infra/gitops/bootstrap/SET_ENVIRONMENT
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=false
      - PruneLast=true
