---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mindclade-production-kueue-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/skip-reconcile: "true"
    argocd.argoproj.io/sync-wave: "-20"
    mindclade.dev/activation-state: blocked
    mindclade.dev/environment: production
spec:
  project: mindclade-operators
  source:
    repoURL: https://github.com/mindclade-org/mindclade.git
    targetRevision: SET_EXACT_40_CHAR_COMMIT_SHA
    path: infra/kubernetes/platform/kueue/chart
    helm:
      releaseName: mindclade-kueue
      valuesObject:
        kueue:
          enableCertManager: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kueue-system
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/part-of: mindclade-platform
        mindclade.dev/owner: ml-platform
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/audit-version: v1.36
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: v1.36
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/warn-version: v1.36
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - PruneLast=true
---
