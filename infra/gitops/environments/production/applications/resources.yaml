apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mindclade-production-kueue-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/skip-reconcile: "true"
    argocd.argoproj.io/sync-wave: "-30"
    mindclade.dev/activation-state: blocked
    mindclade.dev/environment: production
spec:
  project: mindclade-operator-crds
  source:
    repoURL: https://github.com/mindclade/mindclade-internal-monorepo.git
    targetRevision: SET_EXACT_40_CHAR_COMMIT_SHA
    path: infra/kubernetes/platform/kueue/chart
    helm:
      releaseName: kueue
      valuesObject:
        kueue:
          controller:
            enabled: false
          crds:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kueue-system
  revisionHistoryLimit: 10
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: admissionchecks.kueue.x-k8s.io
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: clusterqueues.kueue.x-k8s.io
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: cohorts.kueue.x-k8s.io
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: localqueues.kueue.x-k8s.io
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: multikueueclusters.kueue.x-k8s.io
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: multikueueconfigs.kueue.x-k8s.io
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: provisioningrequestconfigs.kueue.x-k8s.io
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: resourceflavors.kueue.x-k8s.io
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: topologies.kueue.x-k8s.io
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: workloadpriorityclasses.kueue.x-k8s.io
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: workloads.kueue.x-k8s.io
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=false
      - DisableClientSideApplyMigration=true
      - FailOnSharedResource=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mindclade-production-kueue-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/skip-reconcile: "true"
    argocd.argoproj.io/sync-wave: "-20"
    mindclade.dev/activation-state: blocked
