    - group: apiregistration.k8s.io
      kind: APIService
      name: v1beta1.visibility.kueue.x-k8s.io
      jqPathExpressions:
        - .spec.caBundle
    - group: apiregistration.k8s.io
      kind: APIService
      name: v1beta2.visibility.kueue.x-k8s.io
