apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mindclade-production-operator-foundation
  namespace: argocd
  annotations:
    argocd.argoproj.io/skip-reconcile: "true"
    argocd.argoproj.io/sync-wave: "-80"
    mindclade.dev/activation-state: blocked
    mindclade.dev/environment: production
spec:
  project: mindclade-operator-foundation
  source:
    repoURL: https://github.com/mindclade/mindclade-internal-monorepo.git
    targetRevision: SET_EXACT_40_CHAR_COMMIT_SHA
    path: infra/kubernetes/platform/operator-system/foundation
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=false
      - FailOnSharedResource=true
      - PruneLast=true
---
