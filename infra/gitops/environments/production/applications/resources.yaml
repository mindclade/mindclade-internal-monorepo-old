apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mindclade-production-cert-manager-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/skip-reconcile: "true"
    argocd.argoproj.io/sync-wave: "-60"
    mindclade.dev/activation-state: blocked
    mindclade.dev/environment: production
spec:
  project: mindclade-cert-manager-controller
  source:
    repoURL: https://github.com/mindclade/mindclade-internal-monorepo.git
    targetRevision: SET_EXACT_40_CHAR_COMMIT_SHA
    path: infra/gitops/vendor/cert-manager/v1.19.1/controllers
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  revisionHistoryLimit: 10
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: cert-manager-webhook
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: cert-manager-webhook
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=false
      - FailOnSharedResource=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
---
