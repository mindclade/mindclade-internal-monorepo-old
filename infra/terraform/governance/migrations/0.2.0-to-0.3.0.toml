schema_version = 2
from_version = "0.2.0"
to_version = "0.3.0"
status = "planned"
owner = "platform-control"
summary = "Remove the project-wide occurrence editor from the Binary Authorization module and expose the exact create/read-only live-IAM contract."

affected_modules = [
  "binauthz",
]

breaking_change_ids = [
  "module:binauthz:output:signer_grants:value_fingerprint-changed",
  "module:binauthz:resource:google_project_iam_member.signer_occurrence_editor:removed",
]

consumer_steps = [
  "Before upgrading an applied root, apply the authoritative infrastructure-live project-local custom role containing only containeranalysis.occurrences.create, containeranalysis.occurrences.get, and containeranalysis.occurrences.list plus its reviewed project-read permissions.",
  "Prove the build and qualification attestors can create, get, and list occurrences through that custom role and cannot update or delete occurrences.",
  "Review a saved plan for the exact consuming root and require destruction of google_project_iam_member.signer_occurrence_editor with no replacement roles/containeranalysis.occurrences.editor grant before approval.",
]

rollback_steps = [
  "Keep the consuming root pinned to the reviewed v0.2.0 source when the narrow custom role or its signing canary is not yet proven.",
  "If access regresses after the editor removal, repair the authoritative infrastructure-live custom role or binding through a reviewed forward change; do not restore the project-wide editor role.",
  "Do not use terraform state commands for this intentional resource removal; retain state backups and review a saved recovery plan before any corrective apply.",
]

qualification_evidence = [
  "infra/terraform/PRODUCTION_READINESS.md",
  "infra/terraform/modules/binauthz/README.md",
]

# This privilege is intentionally removed rather than renamed, so no state move exists.
state_move = []

[[intentional_removal]]
module = "binauthz"
address = "google_project_iam_member.signer_occurrence_editor"
reason = "The predefined editor role permits occurrence update and delete and makes the reusable module a second owner of project-level IAM; the authoritative live repository instead owns one custom create/get/list role."
consumer_action = "Apply and prove the authoritative live custom role first, then approve a saved plan that destroys this member without creating another occurrence editor grant."
rollback_action = "Keep the prior module source until the live role is proven, or repair the narrow live role through a reviewed forward change after removal; never restore occurrence update/delete as a rollback shortcut."
