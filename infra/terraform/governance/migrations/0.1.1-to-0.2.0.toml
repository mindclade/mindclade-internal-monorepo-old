consumer_steps = [
  "Keep existing roots pinned to v0.1.1 until their owners map every required input and changed object type in the generated module documentation.",
  "For Binary Authorization and IAP, review a saved plan for the two removed IAM addresses; these are resource-model changes, not state-address renames, so no moved block is claimed.",
  "Upgrade one isolated non-production root to the reviewed v0.2.0 commit, retain its plan JSON and policy reports, and require an empty post-apply drift plan before broader adoption.",
]

rollback_steps = [
  "Do not apply a v0.2.0 plan when the migration review is incomplete; continue resolving the module source at v0.1.1.",
  "If a qualified non-production upgrade fails, restore the prior root inputs and v0.1.1 source reference, then review state and a saved rollback plan before any apply.",
  "Never repair an address mismatch with terraform state commands unless a separately approved, backup-backed state migration runbook names the exact addresses.",
]

qualification_evidence = [
  "infra/terraform/PRODUCTION_READINESS.md",
  "docs/architecture/gcp-terraform-well-architected-review.md",
]

# No address rename is asserted in this bootstrap. The two removed IAM resources change
# resource ownership shape and therefore require plan review rather than a same-type move.
state_move = []

[[intentional_removal]]
module = "binauthz"
address = "google_binary_authorization_attestor_iam_member.signer"
reason = "Signer authority was split into explicit additive grants with stricter service-agent separation; the former singleton IAM-member address has no state-compatible successor."
consumer_action = "Review the saved non-production plan and confirm each former signer is represented by the new attestor signer grants before approving destruction of the old address."
rollback_action = "Keep the consuming root pinned to v0.1.1 and restore its prior signer inputs; do not use state commands to coerce the old address into the new ownership model."

[[intentional_removal]]
module = "iap_access"
address = "google_iap_web_backend_service_iam_binding.accessor"
reason = "The authoritative IAM binding was replaced by additive per-member grants so this module no longer removes principals owned by another authority; the resource types are not state-move compatible."
consumer_action = "Review the saved non-production plan, verify every intended accessor has an additive member grant, and confirm no externally owned accessor is removed before approving the old binding deletion."
rollback_action = "Keep the consuming root pinned to v0.1.1 and restore the prior accessor set if additive grants do not reproduce access; never move binding state into member resources."
