# Compatibility sentinel only. Mindclade's GKE policy authority is the native CEL
# ValidatingAdmissionPolicy bundle in infra/kubernetes/platform/security. Keeping this
# valid, empty Kustomization prevents a second policy engine from silently becoming an
# enforcement dependency while preserving the blueprint path for downstream detection.

