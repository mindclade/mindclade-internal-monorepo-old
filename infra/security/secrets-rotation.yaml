---
{
  "schemaVersion": "mindclade.dev/infrastructure-security-control/v1",
  "name": "secrets-rotation",
  "owner": "security-platform",
  "controlFamily": "secrets-rotation",
  "description": "Require keyless workload identity where possible and explicit encrypted secret replication, rotation, access, revocation, and rollback evidence where secrets remain.",
  "planes": ["gcp", "terraform"],
  "enforcementSources": [
    "infra/terraform/modules/kms/main.tf",
    "infra/terraform/modules/secret_manager/main.tf",
    "infra/terraform/modules/workload_identity/main.tf"
  ],
  "testSources": [
    "infra/terraform/modules/kms/tests/kms.tftest.hcl",
    "infra/terraform/modules/secret_manager/tests/secret_manager.tftest.hcl",
    "infra/terraform/modules/workload_identity/tests/workload_identity.tftest.hcl"
  ],
  "requiredEvidence": ["access-review", "audit-query", "key-rotation", "revocation-proof", "workload-identity-proof"],
  "failurePolicy": {"mode": "fail-closed", "onMissingEvidence": "deny-activation", "retry": {"strategy": "bounded", "maxAttempts": 3}},
  "activationPolicy": {"enabledByDefault": false, "environmentOwned": true, "exactRevisionRequired": true, "qualificationDigestRequired": true},
  "rollbackPolicy": {"strategy": "manual-containment", "preserveAuditTrail": true, "requiresOwner": true},
  "nonResponsibilities": [
    "This repository never stores secret payloads, private keys, credentials, tokens, or kubeconfigs.",
    "Rotation cadence, overlap windows, consumers, and emergency revocation are environment-owned decisions."
  ]
}
