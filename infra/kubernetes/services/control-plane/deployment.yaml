            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet: { path: /readyz, port: http, scheme: HTTP }
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 2
      volumes:
        - name: eligibility-policy
          configMap:
            name: control-plane-eligibility-policy
            items:
              - key: production-controls.json
                path: production-controls.json
