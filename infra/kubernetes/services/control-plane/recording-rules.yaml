                )
                or 0 * max by (cluster, location, namespace)
                (kube_deployment_spec_replicas{namespace="mindclade-system",deployment="control-plane-maintenance"})
              )
              == bool max by (cluster, location, namespace)
              (kube_deployment_spec_replicas{namespace="mindclade-system",deployment="control-plane-maintenance"})
