---
# Identities are role-specific even while activation-gated. No role receives an
# API token automatically. The controller/operator/scheduler/ingestion roles need
# separately reviewed RBAC plus an explicitly projected short-lived token before
# they can use their in-cluster client.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane-api
  namespace: mindclade-system
  labels:
    app.kubernetes.io/name: control-plane
    mindclade.dev/control-plane-role: api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane-admin
  namespace: mindclade-system
  labels:
    app.kubernetes.io/name: control-plane
