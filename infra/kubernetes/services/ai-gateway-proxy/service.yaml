---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway-proxy
  namespace: ai
  labels:
    app.kubernetes.io/name: ai-gateway-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-gateway-proxy
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
      appProtocol: http
