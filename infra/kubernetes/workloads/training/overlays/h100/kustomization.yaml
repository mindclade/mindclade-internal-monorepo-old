---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mindclade-training-h100

components:
  - ../../base

resources:
  - recording-rules.yaml

patches:
  - target:
      group: ""
      version: v1
      kind: ConfigMap
      name: mindclade-checkpoint-sidecar-contract
    patch: |-
      - op: replace
        path: /metadata/labels/mindclade.dev~1workload-class
        value: training-h100
  - target:
      group: batch
      version: v1
      kind: Job
      name: mindclade-1g-packed-template
    patch: |-
      - op: replace
        path: /metadata/name
        value: mindclade-h100-1g-packed-template
      - op: replace
        path: /metadata/labels/kueue.x-k8s.io~1queue-name
        value: mindclade-training-h100
      - op: replace
        path: /metadata/labels/mindclade.dev~1workload-class
        value: training-h100
      - op: add
        path: /metadata/labels/mindclade.dev~1capacity-type
        value: on-demand
      - op: add
        path: /metadata/labels/mindclade.dev~1qualification-phase
        value: h100-1g-smoke
      - op: add
        path: /metadata/annotations/mindclade.dev~1qualification-template-authority
        value: tools/qualification/training_gke/h100-1g-smoke.json
      - op: replace
        path: /spec/template/metadata/labels/mindclade.dev~1workload-class
        value: training-h100
      - op: add
        path: /spec/template/metadata/labels/mindclade.dev~1qualification-phase
        value: h100-1g-smoke
      - op: add
        path: /spec/template/spec/nodeSelector/mindclade.dev~1capacity-type
        value: on-demand
      - op: replace
        path: /spec/template/spec/nodeSelector/mindclade.dev~1gpu-profile
        value: gke-h100-a3-megagpu-8g
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: mindclade-training-h100
  - target:
      group: jobset.x-k8s.io
      version: v1alpha2
      kind: JobSet
      name: mindclade-8g-full-template
    patch: |-
      - op: replace
        path: /metadata/name
        value: mindclade-h100-8g-single-node-template
      - op: replace
        path: /metadata/labels/kueue.x-k8s.io~1queue-name
        value: mindclade-training-h100
      - op: replace
        path: /metadata/labels/mindclade.dev~1workload-class
        value: training-h100
      - op: add
        path: /metadata/labels/mindclade.dev~1capacity-type
        value: on-demand
      - op: add
        path: /metadata/labels/mindclade.dev~1qualification-phase
        value: h100-8g-ddp-dcp
      - op: add
        path: /metadata/annotations/mindclade.dev~1execution-profile
        value: single-node-world8
      - op: add
        path: /metadata/annotations/mindclade.dev~1qualification-template-authority
        value: tools/qualification/training_gke/h100-8g-ddp-dcp.json
      - op: replace
        path: /spec/replicatedJobs/0/replicas
        value: 1
      - op: replace
        path: /spec/replicatedJobs/0/template/spec/template/metadata/labels/mindclade.dev~1workload-class
        value: training-h100
      - op: add
        path: /spec/replicatedJobs/0/template/spec/template/metadata/labels/mindclade.dev~1qualification-phase
        value: h100-8g-ddp-dcp
      - op: add
        path: /spec/replicatedJobs/0/template/spec/template/spec/nodeSelector/mindclade.dev~1capacity-type
        value: on-demand
      - op: replace
        path: /spec/replicatedJobs/0/template/spec/template/spec/nodeSelector/mindclade.dev~1gpu-profile
        value: gke-h100-a3-megagpu-8g
      - op: replace
        path: /spec/replicatedJobs/0/template/spec/template/spec/serviceAccountName
        value: mindclade-training-h100
