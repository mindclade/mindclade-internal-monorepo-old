---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # The proxy-only subnet for staging, which must match
  # cidrsubnet(cfg.cidr, 8, 32) in infrastructure-live/_envcommon/vpc.hcl.
  #
  # If these two drift, every backend in this namespace reports UNHEALTHY and the load
  # balancer serves 502s — with nothing in any workload log mentioning a health check,
  # because the probes never arrive.
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: allow-proxy-only-subnet
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/ipBlock/cidr
        value: 10.32.32.0/24
