---
# Non-secret deployment identity only. Workloads must not use this ConfigMap as a
# substitute for a versioned service configuration contract, and credentials must
# never be added here. Each environment overlay replaces MINDCLADE_ENVIRONMENT.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mindclade-foundation
  namespace: mindclade-system
  labels:
    app.kubernetes.io/component: foundation
    mindclade.dev/owner: release-engineering
  annotations:
    mindclade.dev/contains-secrets: "false"
data:
  MINDCLADE_ENVIRONMENT: unbound
  MINDCLADE_DEPLOYMENT_MODE: foundation-only
  MINDCLADE_PLATFORM_CONTRACT_VERSION: "1"
  MINDCLADE_WORKLOAD_ACTIVATION: blocked
---
# Immutable schema/example only: it intentionally contains no CPU, memory, Pod, or GPU capacity.
# An active overlay must create a new digest-addressed immutable ConfigMap from measured evidence;
# it must never mutate this blocked contract or treat these strings as allocatable capacity.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mindclade-capacity-contract-schema-v1
  namespace: mindclade-batch-cpu
  labels:
    app.kubernetes.io/component: capacity-contract
    mindclade.dev/workload-class: batch-cpu
  annotations:
    mindclade.dev/activation-blocker: measured-capacity-contract-absent
    mindclade.dev/contains-secrets: "false"
immutable: true
data:
  activationState: blocked
  activeContractNamePattern: mindclade-capacity-contract-sha256-<64-lowercase-hex>
  capacityValues: absent-until-measured
  contractObject: immutable-configmap
  contractSchema: mindclade.dev/capacity-activation/v1
  digestCanonicalization: sha256-of-utf8-jq-sort-keys-compact-json-data
  queueName: mindclade-batch-cpu
  repositoryBasePolicy: blocked-zero-hold
  requiredEvidence: activation-bundle-digest,capacity-evidence-digest,release-evidence-digest
  requiredQuotaFields: pods,cpu,memory,ephemeral-storage
  secretMaterial: forbidden
  workloadClass: batch-cpu
