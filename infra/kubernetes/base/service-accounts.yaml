---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: mindclade-system
  labels:
    app.kubernetes.io/component: foundation
    app.kubernetes.io/part-of: mindclade-platform
    mindclade.dev/owner: security-and-operations
  annotations:
    mindclade.dev/credential-policy: no-api-token
automountServiceAccountToken: false
---
# Capacity-domain identities intentionally have no RBAC and no environment-neutral cloud
# identity binding. Each environment overlay supplies its exact keyless GSA annotation while
# leaving workload activation blocked; cloud permissions remain resource-scoped in Terraform.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: mindclade-batch-cpu
  labels:
    app.kubernetes.io/component: workload-foundation
    app.kubernetes.io/part-of: mindclade-platform
    mindclade.dev/owner: ml-platform
  annotations:
    mindclade.dev/credential-policy: no-api-token
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mindclade-batch-cpu
  namespace: mindclade-batch-cpu
  labels:
    app.kubernetes.io/component: workload-foundation
    app.kubernetes.io/part-of: mindclade-platform
    mindclade.dev/owner: ml-platform
  annotations:
    mindclade.dev/credential-policy: no-api-token-no-rbac-no-cloud-binding
    mindclade.dev/workload-activation: blocked
automountServiceAccountToken: false
