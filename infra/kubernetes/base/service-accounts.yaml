---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: mindclade-system
  labels:
    app.kubernetes.io/component: foundation
    app.kubernetes.io/part-of: mindclade-platform
    mindclade.dev/owner: security-and-operations
  annotations:
    mindclade.dev/credential-policy: no-api-token
automountServiceAccountToken: false
---
# Identity for suspended, provider-independent workload templates. It has no
# RBAC grant and no API token; a workload needing Kubernetes API access must
# receive a dedicated reviewed identity instead of expanding this account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mindclade-workload
  namespace: mindclade-system
  labels:
    app.kubernetes.io/component: workload-foundation
    app.kubernetes.io/part-of: mindclade-platform
    mindclade.dev/owner: security-and-operations
  annotations:
    mindclade.dev/credential-policy: no-api-token
    mindclade.dev/workload-activation: blocked
automountServiceAccountToken: false
