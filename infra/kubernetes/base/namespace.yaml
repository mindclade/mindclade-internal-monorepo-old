# Batch capacity is isolated from serving and control-plane capacity. Kueue remains disabled
# until a reviewed activation bundle changes this namespace label and both queue hold controls.
apiVersion: v1
kind: Namespace
metadata:
  name: mindclade-batch-cpu
  labels:
    app.kubernetes.io/part-of: mindclade-platform
    kubernetes.io/metadata.name: mindclade-batch-cpu
    mindclade.dev/admission: enforced
    mindclade.dev/capacity-domain: batch-cpu
    mindclade.dev/kueue-enabled: "false"
    mindclade.dev/owner: ml-platform
    mindclade.dev/queue-enforcement: enforced
    mindclade.dev/workload-activation: blocked
    mindclade.dev/workload-class: batch-cpu
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
  annotations:
    mindclade.dev/activation-blocker: queue-held-zero-quota-and-unqualified-release
    mindclade.dev/activation-bundle-digest: blocked
    mindclade.dev/capacity-contract-name: blocked
    mindclade.dev/capacity-evidence-digest: blocked
    mindclade.dev/deployment-status: capacity-foundation-only
    mindclade.dev/environment: unbound
    mindclade.dev/release-evidence-digest: blocked
