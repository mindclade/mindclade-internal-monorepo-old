---
rule_files:
  - __RULE_FILE__

evaluation_interval: 1m

tests:
  - name: kueue controller, reconcile, queue, wait, and admission recordings
    interval: 1m
    input_series:
      - series: up{operator="kueue",cluster="test",location="us-central1",namespace="kueue-system"}
        values: 1x20
      - series: controller_runtime_reconcile_errors_total{operator="kueue",cluster="test",location="us-central1",namespace="kueue-system"}
        values: 0+1x20
      - series: controller_runtime_reconcile_total{operator="kueue",cluster="test",location="us-central1",namespace="kueue-system"}
        values: 0+10x20
      - series: kueue_pending_workloads{cluster="test",location="us-central1",namespace="kueue-system",cluster_queue="training",status="active"}
        values: 3x20
      - series: kueue_admission_wait_time_seconds_bucket{cluster="test",location="us-central1",namespace="kueue-system",cluster_queue="training",le="1"}
        values: 0+60x20
      - series: kueue_admission_wait_time_seconds_bucket{cluster="test",location="us-central1",namespace="kueue-system",cluster_queue="training",le="2"}
        values: 0+120x20
      - series: kueue_admission_wait_time_seconds_bucket{cluster="test",location="us-central1",namespace="kueue-system",cluster_queue="training",le="+Inf"}
        values: 0+120x20
      - series: kueue_admission_attempts_total{cluster="test",location="us-central1",namespace="kueue-system",result="success"}
        values: 0+60x20
    promql_expr_test:
      - expr: mindclade:kueue_controller_up:max
        eval_time: 10m
        exp_samples:
          - labels: mindclade:kueue_controller_up:max{cluster="test",location="us-central1",namespace="kueue-system"}
            value: 1
      - expr: mindclade:kueue_reconcile_error_ratio:ratio5m
        eval_time: 10m
        exp_samples:
          - labels: mindclade:kueue_reconcile_error_ratio:ratio5m{cluster="test",location="us-central1",namespace="kueue-system"}
            value: 0.1
      - expr: mindclade:kueue_reconciles:increase5m
        eval_time: 10m
        exp_samples:
          - labels: mindclade:kueue_reconciles:increase5m{cluster="test",location="us-central1",namespace="kueue-system"}
            value: 50
      - expr: mindclade:kueue_pending_workloads:sum
        eval_time: 10m
        exp_samples:
          - labels: mindclade:kueue_pending_workloads:sum{cluster="test",cluster_queue="training",location="us-central1",namespace="kueue-system",status="active"}
            value: 3
      - expr: mindclade:kueue_admission_wait_seconds:p95_rate5m
        eval_time: 10m
        exp_samples:
          - labels: mindclade:kueue_admission_wait_seconds:p95_rate5m{cluster="test",cluster_queue="training",location="us-central1",namespace="kueue-system"}
            value: 1.9
      - expr: mindclade:kueue_admission_attempts:rate5m
        eval_time: 10m
        exp_samples:
          - labels: mindclade:kueue_admission_attempts:rate5m{cluster="test",location="us-central1",namespace="kueue-system",result="success"}
            value: 1

  - name: jobset controller recordings with low-volume ratio accuracy
    interval: 1m
    input_series:
      - series: up{operator="jobset",cluster="test",location="us-central1",namespace="jobset-system"}
        values: 1x20
      - series: controller_runtime_reconcile_errors_total{operator="jobset",cluster="test",location="us-central1",namespace="jobset-system"}
        values: 0+1x20
      - series: controller_runtime_reconcile_total{operator="jobset",cluster="test",location="us-central1",namespace="jobset-system"}
        values: 0+20x20
    promql_expr_test:
      - expr: mindclade:jobset_controller_up:max
        eval_time: 15m
        exp_samples:
          - labels: mindclade:jobset_controller_up:max{cluster="test",location="us-central1",namespace="jobset-system"}
            value: 1
      - expr: mindclade:jobset_reconcile_error_ratio:ratio5m
        eval_time: 15m
        exp_samples:
          - labels: mindclade:jobset_reconcile_error_ratio:ratio5m{cluster="test",location="us-central1",namespace="jobset-system"}
            value: 0.05
      - expr: mindclade:jobset_reconciles:increase5m
        eval_time: 15m
        exp_samples:
          - labels: mindclade:jobset_reconciles:increase5m{cluster="test",location="us-central1",namespace="jobset-system"}
            value: 100

  - name: jobset reconcile ratio stays defined when no error series exists
    interval: 1m
    input_series:
      - series: controller_runtime_reconcile_total{operator="jobset",cluster="test",location="us-central1",namespace="jobset-system"}
        values: 0+4x20
    promql_expr_test:
      - expr: mindclade:jobset_reconcile_error_ratio:ratio5m
        eval_time: 10m
        exp_samples:
          - labels: mindclade:jobset_reconcile_error_ratio:ratio5m{cluster="test",location="us-central1",namespace="jobset-system"}
            value: 0

  - name: control admission availability and latency preserve semantic decisions
    interval: 1m
    input_series:
      - series: mindclade_control_admission_decisions_total{service="control-admission",role="api",operation="admit",result="allow",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 0+80x80
      - series: mindclade_control_admission_decisions_total{service="control-admission",role="api",operation="admit",result="deny",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 0+10x80
      - series: mindclade_control_admission_decisions_total{service="control-admission",role="api",operation="admit",result="exhausted",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 0+5x80
      - series: mindclade_control_admission_decisions_total{service="control-admission",role="api",operation="commit",result="conflict",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 0+2x80
      - series: mindclade_control_admission_decisions_total{service="control-admission",role="api",operation="commit",result="not_found",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 0+1x80
      - series: mindclade_control_admission_decisions_total{service="control-admission",role="api",operation="release",result="invalid",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 0+1x80
      - series: mindclade_control_admission_decisions_total{service="control-admission",role="api",operation="admit",result="unavailable",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 0+1x80
      - series: mindclade_control_admission_decisions_total{service="control-admission",role="api",operation="admit",result="canceled",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 0+100x80
      - series: mindclade_control_admission_decision_duration_seconds_bucket{service="control-admission",role="api",operation="admit",le="0.05",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 0+98x80
      - series: mindclade_control_admission_decision_duration_seconds_bucket{service="control-admission",role="api",operation="admit",le="0.1",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 0+99x80
      - series: mindclade_control_admission_decision_duration_seconds_bucket{service="control-admission",role="api",operation="admit",le="0.25",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 0+100x80
      - series: mindclade_control_admission_decision_duration_seconds_bucket{service="control-admission",role="api",operation="admit",le="+Inf",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 0+100x80
    promql_expr_test:
      - expr: mindclade:control_admission_decision_events:increase5m
        eval_time: 70m
        exp_samples:
          - labels: mindclade:control_admission_decision_events:increase5m{cluster="test",location="us-central1",namespace="mindclade-system"}
            value: 500
      - expr: mindclade:control_admission_availability_error_ratio:ratio5m
        eval_time: 70m
        exp_samples:
          - labels: mindclade:control_admission_availability_error_ratio:ratio5m{cluster="test",location="us-central1",namespace="mindclade-system"}
            value: 0.01
      - expr: mindclade:control_admission_availability_error_ratio:ratio1h
        eval_time: 70m
        exp_samples:
          - labels: mindclade:control_admission_availability_error_ratio:ratio1h{cluster="test",location="us-central1",namespace="mindclade-system"}
            value: 0.01
      - expr: mindclade:control_admission_availability_error_ratio:ratio30m
        eval_time: 70m
        exp_samples:
          - labels: mindclade:control_admission_availability_error_ratio:ratio30m{cluster="test",location="us-central1",namespace="mindclade-system"}
            value: 0.010000000000000002
      - expr: mindclade:control_admission_availability_error_ratio:ratio6h
        eval_time: 70m
        exp_samples:
          - labels: mindclade:control_admission_availability_error_ratio:ratio6h{cluster="test",location="us-central1",namespace="mindclade-system"}
            value: 0.01
      - expr: mindclade:control_admission_error_budget_burn:ratio5m
        eval_time: 70m
        exp_samples:
          - labels: mindclade:control_admission_error_budget_burn:ratio5m{cluster="test",location="us-central1",namespace="mindclade-system"}
            value: 20
      - expr: mindclade:control_admission_error_budget_burn:ratio1h
        eval_time: 70m
        exp_samples:
          - labels: mindclade:control_admission_error_budget_burn:ratio1h{cluster="test",location="us-central1",namespace="mindclade-system"}
            value: 20
      - expr: mindclade:control_admission_error_budget_fast_burn:paired
        eval_time: 70m
        exp_samples:
          - labels: mindclade:control_admission_error_budget_fast_burn:paired{cluster="test",location="us-central1",namespace="mindclade-system"}
            value: 20
      - expr: mindclade:control_admission_error_budget_slow_burn:paired
        eval_time: 70m
        exp_samples:
          - labels: mindclade:control_admission_error_budget_slow_burn:paired{cluster="test",location="us-central1",namespace="mindclade-system"}
            value: 20
      - expr: mindclade:control_admission_decision_latency_objective:ratio5m
        eval_time: 70m
        exp_samples:
          - labels: mindclade:control_admission_decision_latency_objective:ratio5m{cluster="test",location="us-central1",namespace="mindclade-system"}
            value: 0.99
      # histogram_quantile can differ by a few machine epsilons across promtool architectures.
      # Assert one-nanosecond accuracy explicitly instead of pinning an unstable float rendering.
      - expr: abs(mindclade:control_admission_decision_seconds:p99_rate5m - 0.1) < bool 0.000000001
        eval_time: 70m
        exp_samples:
          - labels: '{cluster="test",location="us-central1",namespace="mindclade-system",operation="admit"}'
            value: 1

  - name: control admission availability stays defined without failure series
    interval: 1m
    input_series:
      - series: mindclade_control_admission_decisions_total{service="control-admission",role="api",operation="admit",result="deny",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 0+4x20
    promql_expr_test:
      - expr: mindclade:control_admission_availability_error_ratio:ratio5m
        eval_time: 10m
        exp_samples:
          - labels: mindclade:control_admission_availability_error_ratio:ratio5m{cluster="test",location="us-central1",namespace="mindclade-system"}
            value: 0

  - name: control admission paired burn keeps one-window spikes below threshold
    interval: 1m
    input_series:
      - series: mindclade:control_admission_error_budget_burn:ratio5m{cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 20x10
      - series: mindclade:control_admission_error_budget_burn:ratio1h{cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 10x10
      - series: mindclade:control_admission_error_budget_burn:ratio30m{cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 20x10
      - series: mindclade:control_admission_error_budget_burn:ratio6h{cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 5x10
    promql_expr_test:
      - expr: mindclade:control_admission_error_budget_fast_burn:paired
        eval_time: 5m
        exp_samples:
          - labels: mindclade:control_admission_error_budget_fast_burn:paired{cluster="test",location="us-central1",namespace="mindclade-system"}
            value: 10
      - expr: mindclade:control_admission_error_budget_slow_burn:paired
        eval_time: 5m
        exp_samples:
          - labels: mindclade:control_admission_error_budget_slow_burn:paired{cluster="test",location="us-central1",namespace="mindclade-system"}
            value: 5

  - name: control admission paired burns require the short window
    interval: 1m
    input_series:
      - series: mindclade:control_admission_error_budget_burn:ratio1h{cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 20x10
      - series: mindclade:control_admission_error_budget_burn:ratio6h{cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 20x10
    promql_expr_test:
      - expr: mindclade:control_admission_error_budget_fast_burn:paired
        eval_time: 5m
        exp_samples: []
      - expr: mindclade:control_admission_error_budget_slow_burn:paired
        eval_time: 5m
        exp_samples: []

  - name: control admission paired burns require the long window
    interval: 1m
    input_series:
      - series: mindclade:control_admission_error_budget_burn:ratio5m{cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 20x10
      - series: mindclade:control_admission_error_budget_burn:ratio30m{cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 20x10
    promql_expr_test:
      - expr: mindclade:control_admission_error_budget_fast_burn:paired
        eval_time: 5m
        exp_samples: []
      - expr: mindclade:control_admission_error_budget_slow_burn:paired
        eval_time: 5m
        exp_samples: []

  - name: control admission maintenance gauges aggregate replicas without hiding age
    interval: 1m
    input_series:
      - series: up{service="control-admission",role="api",pod="api-a",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 1x20
      - series: up{service="control-admission",role="api",pod="api-b",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 0x20
      - series: up{service="unrelated",role="api",pod="unrelated-api",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 1x20
      - series: up{service="control-admission",role="maintenance",pod="maintenance-a",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 1x20
      - series: kube_deployment_spec_replicas{deployment="control-plane-api",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 2x20
      - series: kube_deployment_spec_replicas{deployment="control-plane-maintenance",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 2x20
      - series: mindclade_control_admission_expiration_backlog{service="control-admission",role="maintenance",pod="maintenance-a",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 3x20
      - series: mindclade_control_admission_expiration_backlog{service="control-admission",role="maintenance",pod="maintenance-b",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 7x20
      - series: mindclade_control_admission_oldest_expired_reservation_age_seconds{service="control-admission",role="maintenance",pod="maintenance-a",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 20x20
      - series: mindclade_control_admission_oldest_expired_reservation_age_seconds{service="control-admission",role="maintenance",pod="maintenance-b",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 12x20
      - series: mindclade_control_admission_last_successful_sweep_timestamp_seconds{service="control-admission",role="maintenance",pod="maintenance-a",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 570x20
      - series: mindclade_control_admission_last_successful_sweep_timestamp_seconds{service="control-admission",role="maintenance",pod="maintenance-b",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 580x20
      - series: mindclade_control_admission_consecutive_backlogged_sweeps{service="control-admission",role="maintenance",pod="maintenance-a",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 1x20
      - series: mindclade_control_admission_consecutive_backlogged_sweeps{service="control-admission",role="maintenance",pod="maintenance-b",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 2x20
      - series: mindclade_control_admission_event_drift{service="control-admission",role="maintenance",pod="maintenance-a",kind="missing_outbox",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 1x20
      - series: mindclade_control_admission_event_drift{service="control-admission",role="maintenance",pod="maintenance-b",kind="missing_outbox",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 1x20
      - series: mindclade_control_admission_snapshot_last_success_timestamp_seconds{service="control-admission",role="maintenance",pod="maintenance-a",probe="expiration",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 560x20
      - series: mindclade_control_admission_snapshot_last_success_timestamp_seconds{service="control-admission",role="maintenance",pod="maintenance-b",probe="expiration",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 570x20
      - series: mindclade_control_admission_snapshot_last_success_timestamp_seconds{service="control-admission",role="maintenance",pod="maintenance-a",probe="lineage",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 580x20
      - series: mindclade_control_admission_snapshot_last_success_timestamp_seconds{service="control-admission",role="maintenance",pod="maintenance-b",probe="lineage",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 590x20
      - series: mindclade_control_admission_snapshot_success{service="control-admission",role="maintenance",pod="maintenance-a",probe="expiration",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 0x20
      - series: mindclade_control_admission_snapshot_success{service="control-admission",role="maintenance",pod="maintenance-b",probe="expiration",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 1x20
      - series: mindclade_control_admission_snapshot_success{service="control-admission",role="maintenance",pod="maintenance-a",probe="lineage",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 1x20
    promql_expr_test:
      - expr: mindclade:control_admission_api_target_up:min
        eval_time: 10m
        exp_samples:
          - labels: mindclade:control_admission_api_target_up:min{cluster="test",location="us-central1",namespace="mindclade-system"}
            value: 0
      - expr: mindclade:control_admission_maintenance_target_up:min
        eval_time: 10m
        exp_samples:
          - labels: mindclade:control_admission_maintenance_target_up:min{cluster="test",location="us-central1",namespace="mindclade-system"}
            value: 0
      - expr: mindclade:control_admission_expiration_backlog:max
        eval_time: 10m
        exp_samples:
          - labels: mindclade:control_admission_expiration_backlog:max{cluster="test",location="us-central1",namespace="mindclade-system"}
            value: 7
      - expr: mindclade:control_admission_oldest_expired_reservation_age_seconds:max
        eval_time: 10m
        exp_samples:
          - labels: mindclade:control_admission_oldest_expired_reservation_age_seconds:max{cluster="test",location="us-central1",namespace="mindclade-system"}
            value: 20
      - expr: mindclade:control_admission_last_successful_sweep_age_seconds:max
        eval_time: 10m
        exp_samples:
          - labels: mindclade:control_admission_last_successful_sweep_age_seconds:max{cluster="test",location="us-central1",namespace="mindclade-system"}
            value: 30
      - expr: mindclade:control_admission_consecutive_backlogged_sweeps:max
        eval_time: 10m
        exp_samples:
          - labels: mindclade:control_admission_consecutive_backlogged_sweeps:max{cluster="test",location="us-central1",namespace="mindclade-system"}
            value: 2
      - expr: mindclade:control_admission_event_drift:max
        eval_time: 10m
        exp_samples:
          - labels: mindclade:control_admission_event_drift:max{cluster="test",kind="missing_outbox",location="us-central1",namespace="mindclade-system"}
            value: 1
      - expr: mindclade:control_admission_expiration_snapshot_age_seconds:max
        eval_time: 10m
        exp_samples:
          - labels: mindclade:control_admission_expiration_snapshot_age_seconds:max{cluster="test",location="us-central1",namespace="mindclade-system"}
            value: 40
      - expr: mindclade:control_admission_lineage_snapshot_age_seconds:max
        eval_time: 10m
        exp_samples:
          - labels: mindclade:control_admission_lineage_snapshot_age_seconds:max{cluster="test",location="us-central1",namespace="mindclade-system"}
            value: 20
      - expr: mindclade:control_admission_snapshot_success:min
        eval_time: 10m
        exp_samples:
          - labels: mindclade:control_admission_snapshot_success:min{cluster="test",location="us-central1",namespace="mindclade-system",probe="expiration"}
            value: 0
          - labels: mindclade:control_admission_snapshot_success:min{cluster="test",location="us-central1",namespace="mindclade-system",probe="lineage"}
            value: 1

  - name: control admission metric contracts require every desired replica
    interval: 1m
    input_series:
      - series: up{service="control-admission",role="api",pod="api-a",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 1x20
      - series: up{service="control-admission",role="api",pod="api-b",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 1x20
      - series: up{service="control-admission",role="maintenance",pod="maintenance-a",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 1x20
      - series: up{service="control-admission",role="maintenance",pod="maintenance-b",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 1x20
      - series: kube_deployment_spec_replicas{deployment="control-plane-api",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 1x12 2x8
      - series: kube_deployment_spec_replicas{deployment="control-plane-maintenance",cluster="test",location="us-central1",namespace="mindclade-system"}
        values: 1x12 2x8
      - series: mindclade_control_admission_decisions_total{service="control-admission",role="api",pod="api-a",cluster="test",location="us-central1",namespace="mindclade-system",operation="admit",result="allow"}
        values: 0+1x20
      - series: mindclade_control_admission_decisions_total{service="control-admission",role="api",pod="api-a",cluster="test",location="us-central1",namespace="mindclade-system",operation="admit",result="deny"}
        values: 0+1x20
      - series: mindclade_control_admission_decisions_total{service="control-admission",role="api",pod="api-a",cluster="test",location="us-central1",namespace="mindclade-system",operation="admit",result="exhausted"}
        values: 0+1x20
      - series: mindclade_control_admission_decisions_total{service="control-admission",role="api",pod="api-a",cluster="test",location="us-central1",namespace="mindclade-system",operation="admit",result="conflict"}
        values: 0+1x20
      - series: mindclade_control_admission_decisions_total{service="control-admission",role="api",pod="api-a",cluster="test",location="us-central1",namespace="mindclade-system",operation="admit",result="not_found"}
        values: 0+1x20
