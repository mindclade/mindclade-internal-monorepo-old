---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mindclade-system

resources:
  - ../../base
  - ../../policies

labels:
  - includeSelectors: false
    pairs:
      mindclade.dev/environment: production

patches:
  - path: patches.yaml
  - target:
      version: v1
      kind: Namespace
      name: mindclade-system
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: mindclade-system
        annotations:
          mindclade.dev/environment: production
  - target:
      version: v1
      kind: ConfigMap
      name: mindclade-foundation
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: mindclade-foundation
      data:
        MINDCLADE_ENVIRONMENT: production
