---
# Capacity ceiling for an inactive development namespace. Workload object and
# Pod quotas remain zero; activation is a separately reviewed change.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mindclade-system
  namespace: mindclade-system
spec:
  hard:
    configmaps: "100"
    limits.cpu: "16"
    limits.ephemeral-storage: 200Gi
    limits.memory: 64Gi
    pods: "0"
    requests.cpu: "8"
    requests.ephemeral-storage: 100Gi
    requests.memory: 32Gi
    secrets: "50"
    services: "20"
