---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../platform/security
  - ../../policies

labels:
  - includeSelectors: false
    pairs:
      mindclade.dev/environment: development

patches:
  - path: patches.yaml
  - target:
      version: v1
      kind: ServiceAccount
      namespace: mindclade-batch-cpu
      name: mindclade-batch-cpu
    patch: |-
      - op: add
        path: /metadata/annotations/iam.gke.io~1gcp-service-account
        value: preprocessing@mc-development-research.iam.gserviceaccount.com
      - op: replace
        path: /metadata/annotations/mindclade.dev~1credential-policy
        value: no-api-token-workload-identity
  - target:
      version: v1
      kind: ServiceAccount
      namespace: mindclade-training-h100
      name: mindclade-training-h100
    patch: |-
      - op: add
        path: /metadata/annotations/iam.gke.io~1gcp-service-account
        value: training-h100@mc-development-research.iam.gserviceaccount.com
      - op: replace
        path: /metadata/annotations/mindclade.dev~1credential-policy
        value: no-api-token-workload-identity
  - target:
      version: v1
      kind: ServiceAccount
      namespace: mindclade-training-b200
      name: mindclade-training-b200
    patch: |-
      - op: add
        path: /metadata/annotations/iam.gke.io~1gcp-service-account
        value: training-b200@mc-development-research.iam.gserviceaccount.com
      - op: replace
        path: /metadata/annotations/mindclade.dev~1credential-policy
        value: no-api-token-workload-identity
  - target:
      version: v1
      kind: ServiceAccount
      namespace: mindclade-evaluation
      name: mindclade-holdout-evaluator
    patch: |-
      - op: add
        path: /metadata/annotations/iam.gke.io~1gcp-service-account
        value: holdout-evaluator@mc-development-research.iam.gserviceaccount.com
      - op: replace
        path: /metadata/annotations/mindclade.dev~1credential-policy
        value: no-api-token-workload-identity
  - target:
      version: v1
      kind: Namespace
      name: mindclade-system
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: mindclade-system
        annotations:
          mindclade.dev/environment: development
  - target:
      version: v1
      kind: ConfigMap
      name: mindclade-foundation
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: mindclade-foundation
      data:
        MINDCLADE_ENVIRONMENT: development
