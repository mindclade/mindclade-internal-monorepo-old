---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# The reserved VIP name differs per environment and is the ONE value that must be patched.
#
# It is reserved by Terraform in infrastructure-live/3-networks/gateway-vip and named here.
# Nothing on this side generates it: renaming it in one repository alone leaves a Gateway that
# never receives an address, and the only symptom is a status that never becomes programmed —
# no event, no error, nothing in any workload's logs.
patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: Gateway
      name: mindclade-internal
    patch: |-
      - op: replace
        path: /spec/addresses/0/value
        value: mc-development-mindclade-internal-vip
