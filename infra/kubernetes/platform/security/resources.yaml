---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mindclade-restricted-pods
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  validations:
    - expression: object.spec.serviceAccountName != '' && object.spec.serviceAccountName != 'default'
      message: Pods must use a dedicated, non-default ServiceAccount.
    - expression: has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false
      message: Pods must explicitly disable automatic ServiceAccount token mounts.
    - expression: '!has(object.spec.hostNetwork) || object.spec.hostNetwork == false'
      message: Host networking is forbidden.
    - expression: '!has(object.spec.hostPID) || object.spec.hostPID == false'
      message: Host PID sharing is forbidden.
    - expression: '!has(object.spec.hostIPC) || object.spec.hostIPC == false'
      message: Host IPC sharing is forbidden.
    - expression: '!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))'
      message: hostPath volumes are forbidden.
    - expression: '!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.size() == 0'
      message: Ephemeral containers require a separately audited break-glass namespace.
    - expression: >-
        has(object.spec.securityContext) &&
        object.spec.securityContext.runAsNonRoot == true &&
        has(object.spec.securityContext.seccompProfile) &&
        object.spec.securityContext.seccompProfile.type == 'RuntimeDefault'
      message: Pod security context must require non-root execution and RuntimeDefault seccomp.
    - expression: >-
        object.spec.containers.all(c,
          c.image.matches('^[^:@]+(?:/[^:@]+)+@sha256:[0-9a-f]{64}$'))
      message: Every container image must use an immutable sha256 digest.
    - expression: >-
        !has(object.spec.initContainers) || object.spec.initContainers.all(c,
          c.image.matches('^[^:@]+(?:/[^:@]+)+@sha256:[0-9a-f]{64}$'))
      message: Every init container image must use an immutable sha256 digest.
    - expression: >-
        object.spec.containers.all(c,
          has(c.securityContext) &&
          c.securityContext.allowPrivilegeEscalation == false &&
          c.securityContext.readOnlyRootFilesystem == true &&
          (!has(c.securityContext.privileged) || c.securityContext.privileged == false) &&
          has(c.securityContext.capabilities) &&
          has(c.securityContext.capabilities.drop) &&
          c.securityContext.capabilities.drop.exists(cap, cap == 'ALL'))
      message: Containers must be unprivileged, read-only, and drop all Linux capabilities.
    - expression: >-
        !has(object.spec.initContainers) || object.spec.initContainers.all(c,
          has(c.securityContext) &&
          c.securityContext.allowPrivilegeEscalation == false &&
          c.securityContext.readOnlyRootFilesystem == true &&
          (!has(c.securityContext.privileged) || c.securityContext.privileged == false) &&
          has(c.securityContext.capabilities) &&
          has(c.securityContext.capabilities.drop) &&
          c.securityContext.capabilities.drop.exists(cap, cap == 'ALL'))
      message: Init containers must be unprivileged, read-only, and drop all Linux capabilities.
    - expression: >-
        object.spec.containers.all(c,
          has(c.resources) && has(c.resources.requests) && has(c.resources.limits) &&
          'cpu' in c.resources.requests && 'memory' in c.resources.requests &&
          'ephemeral-storage' in c.resources.requests &&
          'cpu' in c.resources.limits && 'memory' in c.resources.limits &&
          'ephemeral-storage' in c.resources.limits)
      message: Containers must bound CPU, memory, and ephemeral storage with requests and limits.
    - expression: >-
        !has(object.spec.initContainers) || object.spec.initContainers.all(c,
          has(c.resources) && has(c.resources.requests) && has(c.resources.limits) &&
          'cpu' in c.resources.requests && 'memory' in c.resources.requests &&
          'ephemeral-storage' in c.resources.requests &&
          'cpu' in c.resources.limits && 'memory' in c.resources.limits &&
          'ephemeral-storage' in c.resources.limits)
      message: Init containers must bound CPU, memory, and ephemeral storage.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mindclade-restricted-pods
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  policyName: mindclade-restricted-pods
  validationActions:
    - Audit
    - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        mindclade.dev/admission: enforced
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mindclade-internal-services
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - services
  validations:
    - expression: '!has(object.spec.type) || object.spec.type == ''ClusterIP'''
      message: Services in protected namespaces must be ClusterIP; exposure belongs at Gateway API.
    - expression: '!has(object.spec.externalIPs) || object.spec.externalIPs.size() == 0'
      message: Service externalIPs are forbidden.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mindclade-internal-services
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  policyName: mindclade-internal-services
  validationActions:
    - Audit
    - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        mindclade.dev/admission: enforced
---
# Deployment activation is denied while the namespace carries the blocked label. Removing the
# label is itself a reviewed production-readiness change; replicas remain a separate control.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mindclade-block-deployment-activation
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
          - statefulsets
  validations:
    - expression: has(object.spec.replicas) && object.spec.replicas == 0
      message: Workload activation is blocked in this namespace; replicas must remain zero.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mindclade-block-deployment-activation
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  policyName: mindclade-block-deployment-activation
  validationActions:
    - Audit
    - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        mindclade.dev/workload-activation: blocked
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mindclade-block-job-activation
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - batch
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - jobs
      - apiGroups:
          - jobset.x-k8s.io
        apiVersions:
          - v1alpha2
        operations:
          - CREATE
          - UPDATE
        resources:
          - jobsets
  validations:
    - expression: has(object.spec.suspend) && object.spec.suspend == true
      message: Batch activation is blocked in this namespace; Jobs and JobSets must be suspended.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mindclade-block-job-activation
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  policyName: mindclade-block-job-activation
  validationActions:
    - Audit
    - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        mindclade.dev/workload-activation: blocked
