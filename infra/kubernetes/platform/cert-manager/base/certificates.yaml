---
# Studio: APEX ONLY, no wildcard.
#
# This is the one certificate whose SAN list is worth checking by hand after every change.
# `*.mindclade.studio` would NOT cover `mindclade.studio` — a wildcard covers exactly one
# label and never the apex — and by design there is nothing below the apex on this domain for
# a wildcard to cover. Issuing one anyway would widen the blast radius across every name that
# could ever exist here AND publish that intent to a public Certificate Transparency log.
#
# The acceptance check is explicit about this: crt.sh must show `mindclade.studio` and must
# NOT show `*.mindclade.studio`.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-mindclade-studio
  namespace: mindclade-gateway
spec:
  secretName: cert-mindclade-studio
  issuerRef:
    name: letsencrypt-dns01
    kind: ClusterIssuer

  commonName: mindclade.studio
  dnsNames:
    - mindclade.studio

  privateKey:
    algorithm: ECDSA
    size: 256
    # Rotate the key on renewal rather than reusing it. A long-lived key behind a
    # short-lived certificate makes the certificate lifetime cosmetic.
    rotationPolicy: Always

  # Renew with 30 days left on a 90-day certificate. That leaves room for roughly four
  # attempts before expiry — which matters because the ACME failure limit refills slowly, so a
  # renewal that fails needs hours of runway, not minutes.
  duration: 2160h    # 90d
  renewBefore: 720h  # 30d

---
# Machine plane: wildcard.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-mindclade-ai
  namespace: mindclade-gateway
spec:
  secretName: cert-mindclade-ai
  issuerRef:
    name: letsencrypt-dns01
    kind: ClusterIssuer

  # No apex SAN: `mindclade.ai` itself is not served. Adding one would be free at the CA and
  # wrong here — it would advertise an origin that no listener answers.
  dnsNames:
    - "*.mindclade.ai"

  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always

  duration: 2160h
  renewBefore: 720h

---
# Developer plane: wildcard.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-mindclade-dev
  namespace: mindclade-gateway
spec:
  secretName: cert-mindclade-dev
  issuerRef:
    name: letsencrypt-dns01
    kind: ClusterIssuer

  dnsNames:
    - "*.mindclade.dev"

  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always

  duration: 2160h
  renewBefore: 720h
