---
# ACME DNS-01 against Let's Encrypt, solved in Cloud DNS.
#
# ---------------------------------------------------------------------------------------
# Publicly-trusted certificates on names that never resolve publicly
# ---------------------------------------------------------------------------------------
# This is the trick the whole TLS posture rests on, and it is worth stating because it looks
# impossible at first reading: DNS-01 proves control of the DOMAIN, not reachability of the
# HOST. So Let's Encrypt issues for `mindclade.studio` after seeing a TXT record in the public
# zone, and never needs to connect to anything.
#
# What that buys: every client — browsers, curl, the Go toolchain, CI containers — validates
# against the system trust store with no configuration. No private CA, no trust-store
# distribution, no GOINSECURE, no MDM root push.
#
# HTTP-01 could not do this. It requires the CA to reach the host, and no application host in
# this estate is reachable from the internet by design.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns01
  annotations:
    mindclade.dev/description: >-
      Production Let's Encrypt. Validate every CHANGE to this issuer against staging first —
      see letsencrypt-staging below.
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory

    # Where expiry warnings go. A group, never a person: a contact pointing at an individual
    # stops working the day they leave and nobody notices until a certificate lapses.
    email: security@mindclade.com

    privateKeySecretRef:
      name: letsencrypt-dns01-account-key

    solvers:
      - dns01:
          cloudDNS:
            # The DNS host project from infrastructure-live/3-networks/dns-project. The public
            # zones live here; the private zones do too, but the solver never touches those.
            project: mc-common-dns

            # NO serviceAccountSecretRef. Authentication is Workload Identity — there is no key
            # material anywhere in this manifest or in the cluster.
            #
            # The bound service account holds dns.admin on the THREE PUBLIC ZONES ONLY, not
            # project-wide. That scoping matters: this credential's entire job is writing and
            # removing `_acme-challenge` TXT records, and a project-wide grant would also let a
            # compromised solver rewrite the private zones that every hostname resolves through.
            #
            # `hostedZoneName` is deliberately omitted so cert-manager discovers the zone per
            # identifier. Pinning it would be wrong here in a way that is easy to miss: there
            # are THREE public zones, one per domain, and a single pinned name would send every
            # challenge to one of them — where the record would be written successfully, under
            # the wrong apex, and the validation would then fail with a message about a missing
            # TXT record that is in fact present.

---
# Staging, for validating any change to the issuer above.
#
# ---------------------------------------------------------------------------------------
# Why this exists, concretely
# ---------------------------------------------------------------------------------------
# Let's Encrypt's limit that actually bites is FAILURE, not success: five authorization
# failures per identifier per account per hour, refilling one every twelve minutes. A
# misconfigured DNS-01 solver burns through that in minutes and then blocks issuance for an
# hour — while you are debugging, which is exactly when you want to retry.
#
# Successful issuance is nowhere near its ceiling: three certificates, roughly six renewals a
# year, three environments. Staging's limits are effectively unbounded by comparison.
#
# Any ephemeral or per-PR environment uses THIS issuer permanently and never touches production
# ACME. Its certificates are untrusted by browsers, which is the correct trade for an
# environment nobody signs into.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: security@mindclade.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudDNS:
            project: mc-common-dns
