{{- if .Values.activation.enabled }}
{{- include "mindclade-mlflow.activationGuard" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mindclade-mlflow.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mindclade-mlflow.labels" . | nindent 4 }}
  annotations:
    mindclade.dev/release-evidence-digest: {{ .Values.activation.releaseEvidenceDigest | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "mindclade-mlflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mindclade-mlflow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: metadata-lineage
        app.kubernetes.io/part-of: mindclade-platform
        mindclade.dev/authority: mirror
        mindclade.dev/owner: ml-platform
      annotations:
        mindclade.dev/release-evidence-digest: {{ .Values.activation.releaseEvidenceDigest | quote }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ .Values.serviceAccount.name }}
      terminationGracePeriodSeconds: {{ .Values.server.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - server
            - --app-name
            - basic-auth
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.server.port | quote }}
            - --workers
            - {{ .Values.server.workers | quote }}
            - --allowed-hosts
            - {{ join "," .Values.server.allowedHosts | quote }}
            {{- if .Values.server.corsAllowedOrigins }}
            - --cors-allowed-origins
            - {{ join "," .Values.server.corsAllowedOrigins | quote }}
            {{- end }}
            - --x-frame-options
            - {{ .Values.server.xFrameOptions | quote }}
            - --enable-workspaces
            - --expose-prometheus
            - /var/run/mlflow-prometheus
            - --secrets-cache-ttl
            - {{ .Values.server.secretsCacheTTLSeconds | quote }}
            - --secrets-cache-max-size
            - {{ .Values.server.secretsCacheMaxSize | quote }}
          env:
            - name: HOME
              value: /tmp/mlflow
            - name: MLFLOW_BACKEND_STORE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.backendStoreURIKey }}
            - name: MLFLOW_FLASK_SERVER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.flaskSecretKey }}
            - name: MLFLOW_AUTH_CONFIG_PATH
              value: /var/run/secrets/mindclade/mlflow/{{ .Values.auth.authConfigKey }}
            - name: MLFLOW_ARTIFACTS_DESTINATION
              value: {{ .Values.artifacts.destination | quote }}
            - name: MLFLOW_GATEWAY_BUDGET_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.gatewayBudgetRedisURIKey }}
            - name: MLFLOW_GATEWAY_BUDGET_REFRESH_INTERVAL
              value: {{ .Values.server.gatewayBudgetRefreshIntervalSeconds | quote }}
            - name: MLFLOW_CREATE_MODEL_VERSION_SOURCE_VALIDATION_REGEX
              value: {{ .Values.artifacts.modelVersionSourceValidationRegex | quote }}
            - name: MLFLOW_ENABLE_WORKSPACES
              value: "true"
            - name: MLFLOW_TRACE_ARCHIVAL_CONFIG
              value: /var/run/secrets/mindclade/mlflow/{{ .Values.auth.traceArchivalConfigKey }}
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /version
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: runtime-secret
              mountPath: /var/run/secrets/mindclade/mlflow
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: prometheus
              mountPath: /var/run/mlflow-prometheus
      volumes:
        - name: runtime-secret
          secret:
            secretName: {{ .Values.auth.existingSecret }}
            # The non-root process reads this through the Pod fsGroup.
            defaultMode: 0440
            items:
              - key: {{ .Values.auth.authConfigKey }}
                path: {{ .Values.auth.authConfigKey }}
              - key: {{ .Values.auth.traceArchivalConfigKey }}
                path: {{ .Values.auth.traceArchivalConfigKey }}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: prometheus
          emptyDir:
            sizeLimit: 256Mi
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      topologySpreadConstraints:
        {{- range .Values.topologySpreadConstraints }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "mindclade-mlflow.selectorLabels" $ | nindent 14 }}
        {{- end }}
{{- end }}
