{{- if .Values.activation.enabled }}
{{- include "mindclade-mlflow.activationGuard" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mindclade-mlflow.labels" . | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccount | quote }}
    mindclade.dev/credential-policy: no-api-token-workload-identity
automountServiceAccountToken: false
{{- end }}
