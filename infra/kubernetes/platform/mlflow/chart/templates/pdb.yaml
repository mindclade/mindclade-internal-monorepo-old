{{- if and .Values.activation.enabled .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mindclade-mlflow.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mindclade-mlflow.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "mindclade-mlflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metadata-lineage
{{- end }}
