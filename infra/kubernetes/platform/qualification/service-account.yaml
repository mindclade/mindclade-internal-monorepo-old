apiVersion: v1
kind: ServiceAccount
metadata:
  name: mindclade-foundation-qualification
  namespace: mindclade-qualification
  labels:
    app.kubernetes.io/component: foundation-qualification
    app.kubernetes.io/part-of: mindclade-platform
    mindclade.dev/identity-mode: kubernetes-only
