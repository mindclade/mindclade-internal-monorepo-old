---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mindclade-rdma-contract
  namespace: mindclade-system
data:
  activationState: blocked
  transportLabel: mindclade.dev/distributed-transport=rdma
  deviceResource: unset-until-observed
  networkAttachment: unset-until-observed
  b200Profile: gke-b200-a4-highgpu-8g
  privilegePolicy: no-host-devices-until-reviewed
---
# Kubernetes NetworkPolicy is not treated as sufficient isolation for a directly attached RDMA
# device. This deny policy is defense in depth while the device resource and VPC policy remain
# deliberately unconfigured.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: block-unqualified-rdma
  namespace: mindclade-system
spec:
  podSelector:
    matchLabels:
      mindclade.dev/distributed-transport: rdma
  policyTypes:
    - Egress
    - Ingress
