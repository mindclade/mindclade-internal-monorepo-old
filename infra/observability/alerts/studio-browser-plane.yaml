---
{
  "schemaVersion": "mindclade.dev/cloud-monitoring-alert-contract/v1alpha1",
  "name": "studio-browser-plane",
  "owner": "studio-platform",
  "serviceClass": "frontend",
  "availabilityProfile": "internal-interactive",
  "deployment": {"provider": "google-cloud-monitoring", "terraformModule": "infra/terraform/modules/monitoring", "deployableKubernetesResource": false},
  "requiredEnvironmentInputs": ["emailNotificationChannelResourceNames", "environment", "googleChatNotificationChannelResourceNames", "httpsRunbookUrl", "projectId", "qualificationEvidenceSha256"],
  "signals": [
    {"name": "athens-upstream-fetch-failures", "description": "The internal Go proxy cannot fetch required upstream modules and builds remain fail-closed without direct fallback.", "metric": "studio.goproxy.upstream_fetch_failures", "condition": "above", "threshold": 5, "duration": "15m", "severity": "ticket", "missingData": "no-op", "minimumSamples": 5, "runbookAnchor": "athens-upstream-fetch-failures"},
    {"name": "cert-manager-renewal-failed", "description": "Certificate renewal failed independently of the on-wire certificate-expiry probe and needs operator review.", "metric": "certmanager.certificate.renewal_failures", "condition": "above", "threshold": 0, "duration": "1h", "severity": "ticket", "missingData": "no-op", "minimumSamples": 1, "runbookAnchor": "cert-manager-renewal-failed"},
    {"name": "concurrent-streams-approaching-limit", "description": "Sustained browser streams approach the reviewed connection envelope and require capacity review.", "metric": "studio.stream.active_connections", "condition": "above", "threshold": 150, "duration": "1h", "severity": "ticket", "missingData": "no-op", "minimumSamples": 60, "runbookAnchor": "concurrent-streams-approaching-limit"},
    {"name": "distinct-principals-approaching-limit", "description": "Daily principals approach the reviewed Studio isolation envelope and require architecture review.", "metric": "studio.auth.distinct_principals_daily", "condition": "above", "threshold": 400, "duration": "1d", "severity": "ticket", "missingData": "no-op", "minimumSamples": 1, "runbookAnchor": "distinct-principals-approaching-limit"},
    {"name": "handle-store-unavailable", "description": "The browser handoff handle store is unavailable while unrelated browser operations remain healthy.", "metric": "studio.handoff.store_errors", "condition": "above", "threshold": 0, "duration": "15m", "severity": "ticket", "missingData": "no-op", "minimumSamples": 10, "runbookAnchor": "handle-store-unavailable"},
    {"name": "machine-plane-filter-canary-failing", "description": "The machine-plane canary observed forbidden browser headers, indicating the edge filter is detached or broken.", "metric": "studio.machine_plane.canary_headers_leaked", "condition": "above", "threshold": 0, "duration": "5m", "severity": "page", "missingData": "fire", "minimumSamples": 1, "runbookAnchor": "machine-plane-filter-canary-failing"},
    {"name": "run-duration-p99-high", "description": "Run duration p99 approaches the reviewed resumable-stream backend timeout assumption.", "metric": "studio.run.duration_p99_seconds", "condition": "above", "threshold": 2700, "duration": "1d", "severity": "ticket", "missingData": "no-op", "minimumSamples": 100, "runbookAnchor": "run-duration-p99-high"},
    {"name": "run-events-storage-share", "description": "Run-event storage exceeds the reviewed share and requires retention or partitioning action.", "metric": "studio.db.run_events_storage_fraction", "condition": "above", "threshold": 0.4, "duration": "1d", "severity": "ticket", "missingData": "no-op", "minimumSamples": 1, "runbookAnchor": "run-events-storage-share"},
    {"name": "served-certificate-expiring", "description": "The certificate observed by an actual TLS handshake is within the reviewed expiry window.", "metric": "studio.tls.served_cert_days_to_expiry", "condition": "below", "threshold": 14, "duration": "1h", "severity": "page", "missingData": "fire", "minimumSamples": 3, "runbookAnchor": "served-certificate-expiring"},
    {"name": "session-decrypt-failures", "description": "Browser session decrypt failures exceed the reviewed rotation and forgery-detection threshold.", "metric": "studio.session.decrypt_failures", "condition": "above", "threshold": 10, "duration": "5m", "severity": "page", "missingData": "no-op", "minimumSamples": 10, "runbookAnchor": "session-decrypt-failures"},
    {"name": "set-cookie-stripped-on-machine-plane", "description": "A service attempted to emit a browser session cookie on the machine plane and the edge filter stripped it.", "metric": "studio.machine_plane.set_cookie_stripped", "condition": "above", "threshold": 0, "duration": "1h", "severity": "ticket", "missingData": "no-op", "minimumSamples": 1, "runbookAnchor": "set-cookie-stripped-on-machine-plane"},
    {"name": "stream-completion-rate-below-slo", "description": "The fraction of resumable browser runs reaching the terminal done event is below the configured objective.", "metric": "studio.stream.completion_rate", "condition": "below", "threshold": 0.99, "duration": "15m", "severity": "page", "missingData": "fire", "minimumSamples": 100, "runbookAnchor": "stream-completion-rate-below-slo"}
  ],
  "observedSignals": [
    {"name": "api-success-rate", "description": "API success rate excludes expected authentication redirects so session policy does not distort service health.", "metric": "studio.api.success_rate"},
    {"name": "iap-signin-redirect-rate", "description": "Sign-in redirect volume provides a baseline for IAP session-lifetime or OAuth-client changes.", "metric": "studio.iap.signin_redirect_rate"},
    {"name": "stream-resume-rate", "description": "Stream resume rate is expected to be non-zero during deploys and is baselined before alert design.", "metric": "studio.stream.resume_rate"},
    {"name": "trace-propagation", "description": "Trace propagation confirms browser, control-plane, and durable event records remain diagnosably joined.", "metric": "studio.trace.propagation_rate"}
  ],
  "cardinality": {"permittedDimensions": ["cluster", "environment", "location", "namespace", "result", "service"], "forbiddenDimensions": ["dataset", "feature", "label", "model", "molecule", "prompt", "request-id", "sequence", "tenant", "user"], "rawValuesInTelemetry": false},
  "activationPolicy": {"enabledByDefault": false, "requiresSyntheticFireAndResolve": true, "requiresHealthyTelemetry": true, "requiresReviewedThresholds": true}
}
