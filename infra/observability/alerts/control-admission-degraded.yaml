---
{
  "schemaVersion": "mindclade.dev/cloud-monitoring-alert-contract/v1alpha1",
  "name": "control-admission-degraded",
  "owner": "platform-control",
  "serviceClass": "control-plane",
  "availabilityProfile": "control-admission-critical",
  "deployment": {"provider": "google-cloud-monitoring", "terraformModule": "infra/terraform/modules/monitoring", "deployableKubernetesResource": false},
  "requiredEnvironmentInputs": ["emailNotificationChannelResourceNames", "environment", "googleChatNotificationChannelResourceNames", "httpsRunbookUrl", "projectId", "qualificationEvidenceSha256"],
  "signals": [
    {"name": "control-admission-api-metric-contract-incomplete", "description": "At least one desired API replica omitted part of the versioned decision counter or histogram series inventory, so the admission SLI is incomplete.", "metric": "mindclade.control_admission.api_metric_contract_complete", "condition": "below", "threshold": 1, "duration": "1m", "severity": "page", "missingData": "fire", "minimumSamples": 1, "runbookAnchor": "control-admission-api-metric-contract-incomplete"},
    {"name": "control-admission-api-target-absent", "description": "The external admission API telemetry target is unavailable, so decision availability and latency cannot be established.", "metric": "mindclade.control_admission.api_target_up", "condition": "below", "threshold": 1, "duration": "2m", "severity": "page", "missingData": "fire", "minimumSamples": 1, "runbookAnchor": "control-admission-api-target-absent"},
    {"name": "control-admission-audit-outbox-drift", "description": "At least one bounded reconciliation class reports reservation ledger, audit, or outbox version divergence.", "metric": "mindclade.control_admission.event_drift", "condition": "above", "threshold": 0, "duration": "1m", "severity": "page", "missingData": "fire", "minimumSamples": 1, "runbookAnchor": "control-admission-audit-outbox-drift"},
    {"name": "control-admission-backlog-after-two-successful-sweeps", "description": "Expired reservations remain reserved after two successful bounded maintenance sweeps and require fail-closed investigation.", "metric": "mindclade.control_admission.consecutive_backlogged_sweeps", "condition": "above", "threshold": 1, "duration": "1m", "severity": "page", "missingData": "fire", "minimumSamples": 1, "runbookAnchor": "control-admission-backlog-after-two-successful-sweeps"},
    {"name": "control-admission-decision-latency-slo-breached", "description": "Fewer than 99 percent of qualified admission decisions complete within the one-hundred-millisecond objective with sufficient decision volume.", "metric": "mindclade.control_admission.decision_latency_objective_ratio_5m", "condition": "below", "threshold": 0.99, "duration": "5m", "severity": "page", "missingData": "no-op", "minimumSamples": 100, "runbookAnchor": "control-admission-decision-latency-slo-breached"},
    {"name": "control-admission-expiration-snapshot-stale", "description": "The bounded expiration backlog sampler has not completed successfully within its reviewed freshness envelope.", "metric": "mindclade.control_admission.expiration_snapshot_age_seconds", "condition": "above", "threshold": 90, "duration": "2m", "severity": "page", "missingData": "fire", "minimumSamples": 1, "runbookAnchor": "control-admission-expiration-snapshot-stale"},
    {"name": "control-admission-expired-reservation-age", "description": "The oldest reservation that is both expired and still reserved exceeds the fifteen-second materialization objective.", "metric": "mindclade.control_admission.oldest_expired_reservation_age_seconds", "condition": "above", "threshold": 15, "duration": "1m", "severity": "page", "missingData": "fire", "minimumSamples": 1, "runbookAnchor": "control-admission-expired-reservation-age"},
    {"name": "control-admission-fast-error-budget-burn", "description": "Both the five-minute and one-hour admission windows are consuming the 99.95 percent objective error budget above the reviewed fast-burn rate.", "metric": "mindclade.control_admission.error_budget_fast_burn_pair", "condition": "above", "threshold": 14.4, "duration": "5m", "severity": "page", "missingData": "fire", "minimumSamples": 100, "runbookAnchor": "control-admission-fast-error-budget-burn"},
    {"name": "control-admission-lineage-snapshot-stale", "description": "The bounded audit and outbox lineage sampler has not completed successfully within its reviewed freshness envelope.", "metric": "mindclade.control_admission.lineage_snapshot_age_seconds", "condition": "above", "threshold": 90, "duration": "2m", "severity": "page", "missingData": "fire", "minimumSamples": 1, "runbookAnchor": "control-admission-lineage-snapshot-stale"},
    {"name": "control-admission-maintenance-metric-contract-incomplete", "description": "At least one desired maintenance replica omitted a scalar, drift-kind, or probe series from the versioned admission metric inventory.", "metric": "mindclade.control_admission.maintenance_metric_contract_complete", "condition": "below", "threshold": 1, "duration": "1m", "severity": "page", "missingData": "fire", "minimumSamples": 1, "runbookAnchor": "control-admission-maintenance-metric-contract-incomplete"},
    {"name": "control-admission-maintenance-target-absent", "description": "The maintenance telemetry target is unavailable, so sweep freshness and reconciliation correctness cannot be established.", "metric": "mindclade.control_admission.maintenance_target_up", "condition": "below", "threshold": 1, "duration": "2m", "severity": "page", "missingData": "fire", "minimumSamples": 1, "runbookAnchor": "control-admission-maintenance-target-absent"},
    {"name": "control-admission-slow-error-budget-burn", "description": "Both the thirty-minute and six-hour admission windows are consuming the 99.95 percent objective error budget above the reviewed slow-burn rate.", "metric": "mindclade.control_admission.error_budget_slow_burn_pair", "condition": "above", "threshold": 6.0, "duration": "1h", "severity": "ticket", "missingData": "fire", "minimumSamples": 1000, "runbookAnchor": "control-admission-slow-error-budget-burn"},
    {"name": "control-admission-sweep-stale", "description": "No successful reservation-expiration sweep has completed within the fifteen-second materialization objective.", "metric": "mindclade.control_admission.last_successful_sweep_age_seconds", "condition": "above", "threshold": 15, "duration": "1m", "severity": "page", "missingData": "fire", "minimumSamples": 1, "runbookAnchor": "control-admission-sweep-stale"}
  ],
  "observedSignals": [
    {"name": "control-admission-decision-events", "description": "Five-minute bounded decision volume supplies the sample guard for latency and availability interpretation.", "metric": "mindclade.control_admission.decision_events_5m"},
    {"name": "control-admission-decision-p99", "description": "Estimated five-minute p99 latency remains a diagnostic visualization and does not define the exact one-hundred-millisecond alert boundary.", "metric": "mindclade.control_admission.decision_p99_seconds"},
    {"name": "control-admission-expiration-backlog", "description": "Expired reservations still held in the reserved state are exact from zero through one thousand; 1001 is the explicit at-least-1001 overflow sentinel.", "metric": "mindclade.control_admission.expiration_backlog"},
    {"name": "control-admission-snapshot-success", "description": "The bounded expiration and lineage probe outcomes distinguish fresh success from a stale cached zero.", "metric": "mindclade.control_admission.snapshot_success"}
  ],
  "cardinality": {"permittedDimensions": ["cluster", "environment", "kind", "location", "namespace", "operation", "probe", "result", "role", "service"], "forbiddenDimensions": ["dataset", "feature", "idempotency-key", "label", "model", "molecule", "prompt", "provider", "reason", "request-id", "reservation-id", "route", "sequence", "subject", "tenant", "user", "workspace"], "rawValuesInTelemetry": false},
  "activationPolicy": {"enabledByDefault": false, "requiresSyntheticFireAndResolve": true, "requiresHealthyTelemetry": true, "requiresReviewedThresholds": true}
}
