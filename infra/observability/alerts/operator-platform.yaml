---
{
  "schemaVersion": "mindclade.dev/cloud-monitoring-alert-contract/v1alpha1",
  "name": "operator-platform",
  "owner": "ml-platform",
  "serviceClass": "control-plane",
  "availabilityProfile": "internal-interactive",
  "deployment": {"provider": "google-cloud-monitoring", "terraformModule": "infra/terraform/modules/monitoring", "deployableKubernetesResource": false},
  "requiredEnvironmentInputs": ["emailNotificationChannelResourceNames", "environment", "googleChatNotificationChannelResourceNames", "httpsRunbookUrl", "projectId", "qualificationEvidenceSha256"],
  "signals": [
    {"name": "jobset-outcome-ledger-saturation", "description": "Durable JobSet replay-protection state approaches its configured fail-closed capacity and requires planned rotation or expansion.", "metric": "mindclade.jobset.outcome_ledger_utilization_ratio", "condition": "above", "threshold": 0.8, "duration": "15m", "severity": "ticket", "missingData": "no-op", "minimumSamples": 3, "runbookAnchor": "jobset-outcome-ledger-saturation"},
    {"name": "jobset-reconcile-error-ratio", "description": "JobSet reconciliation errors exceed the reviewed ratio after a sufficient controller event sample.", "metric": "mindclade.jobset.reconcile_error_ratio", "condition": "above", "threshold": 0.05, "duration": "10m", "severity": "ticket", "missingData": "no-op", "minimumSamples": 20, "runbookAnchor": "jobset-reconcile-error-ratio"},
    {"name": "jobset-target-absent", "description": "The expected JobSet controller telemetry target is absent and operator health cannot be established.", "metric": "mindclade.jobset.controller_up", "condition": "below", "threshold": 1, "duration": "10m", "severity": "page", "missingData": "fire", "minimumSamples": 1, "runbookAnchor": "jobset-target-absent"},
    {"name": "jobset-terminal-failure-ratio", "description": "Durably exported JobSet failures exceed the reviewed ratio after enough terminal outcomes exist.", "metric": "mindclade.jobset.terminal_failure_ratio", "condition": "above", "threshold": 0.1, "duration": "15m", "severity": "ticket", "missingData": "no-op", "minimumSamples": 20, "runbookAnchor": "jobset-terminal-failure-ratio"},
    {"name": "kueue-reconcile-error-ratio", "description": "Kueue reconciliation errors exceed the reviewed ratio after a sufficient controller event sample.", "metric": "mindclade.kueue.reconcile_error_ratio", "condition": "above", "threshold": 0.05, "duration": "10m", "severity": "ticket", "missingData": "no-op", "minimumSamples": 20, "runbookAnchor": "kueue-reconcile-error-ratio"},
    {"name": "kueue-target-absent", "description": "The expected Kueue controller telemetry target is absent and queue health cannot be established.", "metric": "mindclade.kueue.controller_up", "condition": "below", "threshold": 1, "duration": "10m", "severity": "page", "missingData": "fire", "minimumSamples": 1, "runbookAnchor": "kueue-target-absent"},
    {"name": "queue-admission-stalled", "description": "Admissible queued work remains pending without admission progress beyond the reviewed operating window.", "metric": "mindclade.kueue.pending_active", "condition": "above", "threshold": 0, "duration": "15m", "severity": "ticket", "missingData": "no-op", "minimumSamples": 3, "runbookAnchor": "queue-admission-stalled"}
  ],
  "cardinality": {"permittedDimensions": ["cluster", "environment", "location", "namespace", "result", "service"], "forbiddenDimensions": ["dataset", "feature", "label", "model", "molecule", "prompt", "request-id", "sequence", "tenant", "user"], "rawValuesInTelemetry": false},
  "activationPolicy": {"enabledByDefault": false, "requiresSyntheticFireAndResolve": true, "requiresHealthyTelemetry": true, "requiresReviewedThresholds": true}
}
