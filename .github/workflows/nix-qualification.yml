name: Nix qualification

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: nix-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: nix
    uses: mindclade/.github/.github/workflows/reusable-nix-qualification.yml@v4.1.0
    with:
      watch-path-regex: '(^|/)(flake\.nix|flake\.lock|[^/]+\.nix)$|^\.github/workflows/.*nix.*\.ya?ml$|^tools/build/(nix|bazel/(extensions|toolchains))/|^(\.bazelversion|\.bazelrc|MODULE\.bazel)$'
      ci-command: python3 ci/presubmit/pipeline.py --static-only
      enable-aarch64-linux: true
      enable-aarch64-darwin: true
      reproducibility-targets: |-
        .#packages.x86_64-linux.cc-toolchain-bundle
        .#packages.x86_64-linux.toolchain-manifest
        .#checks.x86_64-linux.flake-lock
