#
# Artifact authority begins only when a reviewed, immutable release request is added to
# protected main. Pull requests remain on GitHub-hosted runners and cannot reach this lane.
name: Reviewed release request

on:
  push:
    branches: [main]
    paths:
      - ci/release/requests/*.yaml

permissions:
  contents: read

concurrency:
  group: reviewed-release-request
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      request-path: ${{ steps.request.outputs.request-path }}
      rollback-digest: ${{ steps.request.outputs.rollback-digest }}
    steps:
      - name: Reject non-platform or non-main events
        run: |
          set -euo pipefail
          [ "$GITHUB_EVENT_NAME" = push ]
          [ "$GITHUB_REF" = refs/heads/main ]
          [ "$GITHUB_REPOSITORY" = mindclade/mindclade-internal-monorepo ]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - id: request
        name: Select exactly one newly reviewed request
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse --verify 'HEAD^{commit}')" = "$GITHUB_SHA" ]
          [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]
          mapfile -t requests < <(
            git diff --diff-filter=A --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- \
              'ci/release/requests/*.yaml'
          )
          [ "${#requests[@]}" -eq 1 ] || {
            echo "::error::a release change must add exactly one immutable request"
            exit 1
          }
          python3 ci/release/release_request.py inspect \
            --request "${requests[0]}" \
            --source-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

  canary:
    needs: discover
    permissions:
      contents: read
      id-token: write
    uses: mindclade/.github/.github/workflows/reusable-arc-wif-canary.yml@v4.0.0

  build:
    needs: [discover, canary]
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: mindclade/.github/.github/workflows/reusable-arc-oci-build.yml@v4.0.0
    with:
      request-path: ${{ needs.discover.outputs.request-path }}

  qualify:
    needs: build
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: mindclade/.github/.github/workflows/reusable-arc-oci-qualify.yml@v4.0.0
    with:
      candidate-artifact: ${{ needs.build.outputs.candidate-artifact }}
      image-ref: ${{ needs.build.outputs.image-ref }}

  qualification-attestation:
    needs: [build, qualify]
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: mindclade/.github/.github/workflows/reusable-arc-qualification-attest.yml@v4.0.0
    with:
      qualification-artifact: ${{ needs.qualify.outputs.qualification-artifact }}
      image-ref: ${{ needs.build.outputs.image-ref }}

  deployment-attestation:
    needs: [build, qualification-attestation]
    permissions:
      contents: read
      id-token: write
    uses: mindclade/.github/.github/workflows/reusable-binauthz-sign.yml@v4.0.0
    with:
      image-ref: ${{ needs.build.outputs.image-ref }}

  propose-promotion:
    needs: [discover, build, deployment-attestation]
    permissions:
      contents: read
      id-token: write
    uses: mindclade/.github/.github/workflows/reusable-gitops-promote.yml@v4.0.0
    with:
      image-ref: ${{ needs.build.outputs.image-ref }}
      release-id: ${{ needs.build.outputs.release-id }}
      rollback-digest: ${{ needs.discover.outputs.rollback-digest }}
