#
# The PR gate for the monorepo.
#
# Named `presubmit` to match docs/blueprint/production-monorepo-paths.txt, which reserves
# .github/workflows/{presubmit,gpu,nightly,release,security}.yml. The lanes here are the three
# that run on ordinary hardware; gpu/nightly/release remain unmaterialized because they need
# self-hosted runners and a release process that do not exist yet.
#
# JOB IDS ARE LOAD-BEARING. github-config's `required-checks-go` ruleset requires the status
# check context "ci / build". For a called reusable workflow GitHub composes that context as
# "<caller job id> / <called job id>", and reusable-go-ci's job is `build` — so the Go lane's
# job MUST stay `ci`. Renaming it produces a required check that is never satisfied and a
# default branch nothing can merge into.
name: Presubmit

on:
  push:
    branches: [main]
  pull_request:

# Read-only at the top level. No lane here writes anything; CodeQL's security-events: write
# lives in security.yml, scoped to the job that needs it.
permissions:
  contents: read

# Safe to cancel: unlike an infrastructure apply, a superseded CI run has no partial state to
# leave behind. Cancelling saves runner minutes on force-push-heavy branches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The repository's own architecture invariants — dependency budgets and layering, Go module
  # and admission rules, Rust workspace shape, Cargo/Bazel dep parity, component maturity.
  #
  # tools/analysis/check_affected_presubmit.py asserts this job exists and that the checkout is
  # unshallow, because ci/presubmit/pipeline.py derives the affected target set from git history.
  #
  # `--static-only` stops after the architecture checks. The full path additionally runs Rust
  # qualification and `bazelw test` over the affected targets, which needs a Bazel toolchain this
  # workflow does not provision yet. Named here rather than left implicit: the affected-target
  # lane is the missing half, not something this file pretends to cover.
  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history. affected.git_changed() diffs against a base ref; a shallow clone makes
          # that diff either empty or an error, and an empty diff silently selects no targets.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12.12"

      # Stdlib only by design, so there is nothing to install first.
      - run: python3 ci/presubmit/pipeline.py --static-only

  # Go — the fleet control plane and durable policy. ~59k LOC, the largest lane.
  #
  # Do not rename this job. See the note above.
  ci:
    uses: mindclade-org/.github/.github/workflows/reusable-go-ci.yml@v1.1.0
    with:
      # BELOW the `go` directive in go.mod, which is 1.26.0 — not 1.25.0, as this comment used
      # to claim. The lane therefore only builds because GOTOOLCHAIN defaults to `auto` and the
      # 1.25.12 toolchain downloads 1.26.0 on demand; under GOTOOLCHAIN=local, or on a runner
      # without module-proxy egress, `go build` fails with "go.mod requires go >= 1.26.0".
      # Raise this to a 1.26.x release so the pin is the toolchain that actually runs.
      go-version: "1.25.12"
      # The control plane is concurrent throughout — durable coordination, schedulers, event
      # dispatch. The race detector is the point of running tests here at all.
      race: true
      # Reporting only for now. Raise this once the control-plane packages carry the coverage
      # to survive a gate; a threshold that fails on day one gets disabled on day two.
      coverage-threshold: 0

  # Rust — the online/runtime data plane and node execution.
  rust:
    uses: mindclade-org/.github/.github/workflows/reusable-rust-ci.yml@v1.1.0
    with:
      # Explicit rather than empty. reusable-rust-ci resolves `inputs.toolchain || 'stable'`,
      # so leaving this blank silently pins to whatever stable is that week — it never reads
      # rust-toolchain.toml despite the input's description. This value tracks the workspace
      # `rust-version`; change both together.
      toolchain: "1.97.1"
      features: "--all-features"
      # deny.toml is present at the root, so cargo-deny has a policy to enforce.
      deny: true

  # Python — scientific, model, training, inference, and evaluation numerics.
  python:
    uses: mindclade-org/.github/.github/workflows/reusable-uv-ci.yml@v1.1.0
    with:
      python-version: "3.12.12"
      # Empty, not "--all-packages". pyproject sets `[tool.uv] package = false` and declares no
      # uv workspace members, so this is a single root project — `--all-packages` errors.
      packages: ""
      # Disabled deliberately. reusable-uv-ci typechecks with pyright; this repo's pyproject
      # configures mypy in strict mode instead, and pyright is not in the dev group. Turning
      # this on means adding pyright and reconciling two type checkers' disagreements — a real
      # piece of work, not a flag flip.
      typecheck: false

  # ---------------------------------------------------------------------------------------
  # Workflow and YAML lint
  # ---------------------------------------------------------------------------------------
  # .yamllint.yaml and .github/actionlint.yaml are the CANONICAL copies — the `.github`
  # repository's are copies of these — and until now neither existed here, so the repository
  # the configs claimed to mirror had no lint at all.
  #
  # Binaries from `.#ci`, not a release download: actionlint shells out to shellcheck, and
  # versions disagree about SC2153 and SC2015. A locally installed actionlint can pass on a
  # change this job fails.
  lint:
    name: actionlint + yamllint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      - name: actionlint
        run: nix develop .#ci --command actionlint -color

      - name: yamllint
        run: nix develop .#ci --command yamllint --strict .

  # ---------------------------------------------------------------------------------------
  # Terraform — infra/terraform
  # ---------------------------------------------------------------------------------------
  # This is not a monorepo-internal concern. infrastructure-live consumes every module under
  # infra/terraform/modules BY SEMVER TAG, so a module that does not validate here breaks a
  # different repository's plan — and it breaks it at a tag, after the merge, with the error
  # surfacing in a repo whose diff shows nothing.
  #
  # `terraform test` is the part worth having. Sixteen modules carry .tftest.hcl suites and
  # they run against a mock provider, so this needs no credentials and reaches no cloud.
  terraform:
    name: terraform fmt + validate + test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      - name: fmt
        run: nix develop .#ci --command terraform fmt -check -recursive infra/terraform

      # Per module, because `terraform validate` needs an initialised directory and there is
      # no root module here — infra/terraform/modules/* are library modules consumed elsewhere.
      # -backend=false so nothing looks for a state bucket.
      - name: validate
        run: |
          set -euo pipefail
          failed=0
          for dir in infra/terraform/modules/*/; do
            if ! out=$(nix develop .#ci --command bash -c "cd '$dir' && terraform init -backend=false -input=false >/dev/null && terraform validate -no-color" 2>&1); then
              echo "::error file=${dir}::terraform validate failed"
              printf '%s\n' "$out"
              failed=1
            fi
          done
          exit "$failed"

      - name: test
        # Only the modules that have a suite. A module with no tests is a gap, not a failure —
        # and reporting it as a failure here would make the gate something people disable
        # rather than something they close.
        run: |
          set -euo pipefail
          failed=0
          ran=0
          for dir in infra/terraform/modules/*/; do
            [ -d "${dir}tests" ] || continue
            ran=$((ran + 1))
            if ! out=$(nix develop .#ci --command bash -c "cd '$dir' && terraform test -no-color" 2>&1); then
              echo "::error file=${dir}::terraform test failed"
              printf '%s\n' "$out"
              failed=1
            fi
          done
          echo "Ran ${ran} module test suite(s)."
          exit "$failed"

  # ---------------------------------------------------------------------------------------
  # Bazel — loading phase
  # ---------------------------------------------------------------------------------------
  # `bazel query //...` loads every BUILD file in the workspace and resolves every label in
  # them. It does not configure or build anything, which is exactly what makes it usable here:
  # it needs no external dependency graph, so it runs in about a minute and catches the class
  # of error that is invisible in review and fatal to everything downstream.
  #
  # That class is not hypothetical. Wiring this lane immediately found
  # services/workers/ingestion declaring `srcs = ["tests/integration.rs"]` across a package
  # boundary — a label Bazel refuses outright, which stopped `//...` from evaluating AT ALL and
  # therefore hid every other result in the repository.
  #
  # WHY NOT `--nobuild`. Full analysis additionally resolves external repositories, and two
  # TOOLCHAIN VERSIONS still stop it. Neither is a workflow change, and both are one line in
  # MODULE.bazel once the upstream support exists:
  #
  #   Rust — cargo-bazel splices the workspace with rules_rust's host tools, which ship Cargo
  #   1.84. This workspace is `edition = "2024"`, stabilised in Cargo 1.85, so cargo-bazel
  #   cannot PARSE the workspace and the crate_universe extension fails to evaluate. That
  #   aborts analysis for the whole repository, Go targets included. `rust.toolchain(versions
  #   = ...)` does not fix it: the host tools are a separate repository from the registered
  #   toolchain.
  #
  #   Go — RESOLVED, and the step below is what keeps it that way. The blocker recorded here
  #   (gazelle's fetch_repo running under rules_go's default 1.22.7 SDK against an otelhttp
  #   needing go >= 1.25) no longer reproduces: external Go modules fetch and compile, and
  #   111 of the 114 go_test targets build and pass.
  #
  # Everything BEFORE those two is now resolved — the go_deps and crate_universe extensions
  # are declared, every workspace manifest is tracked, and the visibility graph is clean. The
  # last full run analysed 900 targets and configured 9,336 before hitting the Rust host
  # tools. Promote this step to `bazel build //... --nobuild` in the commit that closes them.
  #
  # buildifier runs FIRST. A malformed BUILD file fails `query` with a Starlark traceback;
  # buildifier names the file, the line and the rule in one line.
  bazel:
    name: bazel loading and Go tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Reads .bazelversion. rules_go 0.51 does not load under Bazel 9 — `cross.bzl` uses
      # APIs it removed — so an unpinned launcher fails at analysis with an error about a
      # Starlark file nobody in this repository wrote.
      - uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8  # v0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # buildifier comes from the flake, like every other linter in this repository, so the
      # version that gates a PR is the version `nix develop` gives you locally.
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      # Reads .buildifier.json: format plus a 39-warning lint set, narrower than buildifier's
      # default `all`. Every name in that file has to be one this buildifier knows — an
      # unrecognised name makes it exit 1 before reading a single file, with a message about
      # configuration rather than about code.
      - name: buildifier
        run: nix develop .#ci --command buildifier --mode=check -r .

      - name: Every BUILD file loads and every label resolves
        run: bazel query '//...' --output=label --curses=no --color=no > /dev/null

      # The loading phase above proves labels resolve. It does not run a single test, and for
      # as long as that was the whole lane the repository had 114 go_test targets that CI had
      # never executed — which is how //tests/integration/cross_language:go_golden_test came
      # to be unable to pass under Bazel AT ALL (no `data`, and fixtures resolved through
      # runtime.Caller, which Bazel reports as a workspace-relative path) without anyone
      # noticing. `--config=ci` was broken the same way and for the same reason.
      #
      # GO AND PYTHON, by explicit target list rather than `//...`. The crate_universe
      # extension still fails to evaluate — see the Rust note above — and it aborts analysis
      # for whatever is in the configured graph, so a wildcard would take these down with it.
      # Naming them keeps Rust's blocker from hiding everyone else's results. Swap this for
      # `bazel test //...` in the commit that closes the rules_rust bump.
      - name: Go and Python targets build and pass under Bazel
        run: |
          set -euo pipefail
          bazel query 'kind("(go|py)_test rule", //...)' \
            --output=label --curses=no --color=no > bazel_tests.txt
          count="$(wc -l < bazel_tests.txt)"
          # A query that silently returns nothing would make this lane pass having tested
          # nothing, which is the exact shape of gate this repository keeps removing.
          if [ "$count" -eq 0 ]; then
            echo "::error::no go_test/py_test targets matched; the query or the graph changed" >&2
            exit 1
          fi
          echo "Testing ${count} target(s) under Bazel."
          bazel test --config=ci --target_pattern_file=bazel_tests.txt


  # ---------------------------------------------------------------------------------------
  # TypeScript / pnpm
  # ---------------------------------------------------------------------------------------
  # WHAT THIS DOES NOT DO: typecheck. There is no TypeScript toolchain in this repository —
  # pnpm-lock.yaml declares no dependencies, every workspace package's `build` and `test` are
  # `echo scaffold`, and the ts BUILD.bazel files are filegroups rather than ts_project. A job
  # running `tsc` here would either fail on a missing binary or, worse, pass having compiled
  # nothing. That is the shape of gate this repository has just finished removing from its
  # Python suite.
  #
  # What it does do is real and is the part that rots silently: the workspace manifest, the
  # lockfile and the package tree agree. A package added to pnpm-workspace.yaml with no
  # package.json, or a lockfile that no longer matches the manifests, fails here.
  typescript:
    name: pnpm workspace integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
        with:
          version: 10

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6
        with:
          node-version: "22.16.0"
          cache: pnpm

      # --frozen-lockfile is the assertion: it fails if the lockfile does not match the
      # manifests rather than quietly updating it, which is what a local `pnpm install` does.
      - name: Lockfile matches the manifests
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Every workspace package exists
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            # A glob that matches nothing means a workspace entry with no package behind it.
            matches=0
            for dir in $pattern; do
              [ -d "$dir" ] || continue
              matches=$((matches + 1))
              if [ ! -f "$dir/package.json" ]; then
                echo "::error file=$dir::workspace member has no package.json"
                failed=1
              fi
            done
            if [ "$matches" -eq 0 ]; then
              echo "::error file=pnpm-workspace.yaml::pattern '$pattern' matches no directory"
              failed=1
            fi
          done < <(grep -oE '^\s+- "[^"]+"' pnpm-workspace.yaml | sed -E 's/.*"(.*)"/\1/')
          exit "$failed"
