---
# Copyright © 2026 Mindclade, LLC. All Rights Reserved.
# Mindclade Proprietary and Confidential.
# SPDX-License-Identifier: LicenseRef-Mindclade-Proprietary
#
# The PR gate for the monorepo.
#
# Named `presubmit` to match docs/blueprint/production-monorepo-paths.txt, which reserves
# .github/workflows/{presubmit,gpu,nightly,release,security}.yml. GPU remains separately gated
# on qualified hardware; the CPU nightly lane is materialized in nightly.yml.
#
# JOB IDS ARE LOAD-BEARING. github-config already declares "ci / build" and "architecture";
# lint and terraform are staged to join them after their exact contexts are observed on a PR.
# For a called reusable workflow GitHub composes the Go context as
# "<caller job id> / <called job id>", and reusable-go-ci's job is `build` — so the Go lane's
# job MUST stay `ci`. Renaming it produces a required check that is never satisfied.
name: Presubmit

on:
  push:
    branches: [main]
  pull_request:
  # Required checks must be emitted for the synthetic merge result used by merge queue.
  # Omitting this event leaves every queued change waiting forever on contexts that can only
  # exist on pull_request heads.
  merge_group:

# Read-only at the top level. No lane here writes anything; CodeQL's security-events: write
# lives in security.yml, scoped to the job that needs it.
permissions:
  contents: read

# Safe to cancel: unlike an infrastructure apply, a superseded CI run has no partial state to
# leave behind. Cancelling saves runner minutes on force-push-heavy branches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The repository's own architecture invariants — dependency budgets and layering, Go module
  # and admission rules, Rust workspace shape, Cargo/Bazel dep parity, component maturity.
  #
  # tools/analysis/check_affected_presubmit.py asserts this job exists and that the checkout is
  # unshallow, because ci/presubmit/pipeline.py derives the affected target set from git history.
  #
  # `--static-only` stops after the architecture checks. The Bazel job invokes the same pipeline's
  # evidence-producing affected path inside the pinned Bazel/Nix environment.
  architecture:
    name: architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history. affected.git_changed() diffs against a base ref; a shallow clone makes
          # that diff either empty or an error, and an empty diff silently selects no targets.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.14.7"

      # Stdlib only by design, so there is nothing to install first.
      - run: python3 ci/presubmit/pipeline.py --static-only

  # Go — the fleet control plane and durable policy. ~59k LOC, the largest lane.
  #
  # Do not rename this job. See the note above.
  ci:
    uses: mindclade/.github/.github/workflows/reusable-go-ci.yml@7e4b7a873fc9312c2985ed262b251455c71756fe  # v3.0.0
    with:
      # The toolchain the devShell resolves, which is also what tools/build/nix/versions.nix
      # pins the language level to (go = "1.26") and what tools/build/nix/toolchain-manifest.json
      # records as evidence.
      #
      # WAS "1.25.12", below the `go` directive in go.mod. That lane only built because
      # GOTOOLCHAIN defaults to `auto` and 1.25.12 downloaded 1.26.0 on demand — so under
      # GOTOOLCHAIN=local, or on a runner without module-proxy egress, `go build` fails with
      # "go.mod requires go >= 1.26.0" and the gate that was supposed to catch it is the thing
      # that breaks.
      go-version: "1.26.6"
      # The shared workflow's v2.6.2 default was compiled with Go 1.25 and refuses to analyze
      # a module targeting Go 1.26. Pin the first validated release line built with Go 1.26.
      golangci-lint-version: "v2.12.2"
      # The control plane is concurrent throughout — durable coordination, schedulers, event
      # dispatch. The race detector is the point of running tests here at all.
      race: true
      # Reporting only for now. Raise this once the control-plane packages carry the coverage
      # to survive a gate; a threshold that fails on day one gets disabled on day two.
      coverage-threshold: 0

  # Real PostgreSQL qualification for the registry and AI Gateway admission
  # composition boundaries. Unit tests use sqltest to force edge conditions;
  # this lane proves the same DDL, JSONB round trip, transaction rollback,
  # SQLSTATE qualification, lease fencing, atomic audit/outbox writes, bounded
  # serializable retries, and no-overspend behavior against the actual lib/pq
  # driver and PostgreSQL server.
  go-postgres-qualification:
    name: Go registry + admission / live PostgreSQL and failure injection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mindclade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mindclade_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5  # v6.2.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum

      - name: Live registry, admission, and fault qualification
        env:
          GOTOOLCHAIN: local
          MINDCLADE_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/mindclade_test?sslmode=disable
        run: >-
          go test -race -count=1 -v
          ./services/control_plane/internal/providers/maintenance
          ./services/control_plane/internal/store/postgres
          ./services/control_plane/internal/store/postgres/admission

      - name: Execute the declared failure-injection matrix
        env:
          GOTOOLCHAIN: local
          MINDCLADE_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/mindclade_test?sslmode=disable
        run: python3 tools/qualification/failure_injection.py --execute --owner control-plane

  # Rust — the online/runtime data plane and node execution.
  rust:
    uses: mindclade/.github/.github/workflows/reusable-rust-ci.yml@7e4b7a873fc9312c2985ed262b251455c71756fe  # v3.0.0
    with:
      # Explicit rather than empty. reusable-rust-ci resolves `inputs.toolchain || 'stable'`,
      # so leaving this blank silently pins to whatever stable is that week — it never reads
      # rust-toolchain.toml despite the input's description. This value tracks the workspace
      # `rust-version`; change both together.
      toolchain: "1.97.1"
      features: "--all-features"
      # deny.toml is present at the root, so cargo-deny has a policy to enforce.
      deny: true

  # Python — scientific, model, training, inference, and evaluation numerics.
  python:
    uses: mindclade/.github/.github/workflows/reusable-uv-ci.yml@7e4b7a873fc9312c2985ed262b251455c71756fe  # v3.0.0
    with:
      python-version: "3.14.7"
      # Empty, not "--all-packages". pyproject sets `[tool.uv] package = false` and declares no
      # uv workspace members, so this is a single root project — `--all-packages` errors.
      packages: ""
      # Disabled deliberately. reusable-uv-ci typechecks with pyright; this repo's pyproject
      # configures mypy in strict mode instead, and pyright is not in the dev group. Turning
      # this on means adding pyright and reconciling two type checkers' disagreements — a real
      # piece of work, not a flag flip.
      typecheck: false

  # The shared Python workflow currently owns lint and pytest but hard-codes pyright for its
  # optional type step. This repository's contract is strict mypy, so run that checker in a
  # narrow companion job instead of claiming type coverage through a different tool.
  python-types:
    name: strict mypy / libs/python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.14.7"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      # Keep this lane narrow: libs/python imports NumPy but not the root project's heavyweight
      # Torch runtime. The locked typecheck group supplies exactly the checker and import surface.
      - run: uv run --frozen --only-group typecheck mypy libs/python

  # ---------------------------------------------------------------------------------------
  # Toolchain, workflow and YAML lint
  # ---------------------------------------------------------------------------------------
  # .yamllint.yaml and .github/actionlint.yaml are the CANONICAL copies — the `.github`
  # repository's are copies of these — and until now neither existed here, so the repository
  # the configs claimed to mirror had no lint at all.
  #
  # Binaries from `.#ci`, not a release download: actionlint shells out to shellcheck, and
  # versions disagree about SC2153 and SC2015. A locally installed actionlint can pass on a
  # change this job fails.
  #
  # `nix flake check` runs HERE rather than in a job of its own, and the reason is cost rather
  # than taste: installing Nix and realising `.#ci-lint` is most of this job's wall clock, and a
  # separate job pays all of it a second time for checks that take seconds once the store is
  # warm. Two lanes' worth of signal, one nixpkgs evaluation.
  #
  # The job id and display name stay `lint`. Its exact PR context will be observed before the
  # staged github-config ruleset update makes it merge-blocking.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare GitHub-hosted runner disk for Nix
        run: ci/common/prepare_nix_runner.sh

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      # ADR-0002 states that CI rejects host-tool leakage and toolchain-manifest drift, and that
      # compatibility version files are generated from the Nix-owned source. The checks that
      # assert all three live in tools/build/nix/checks/, and until this step existed nothing ran
      # them: they were reachable only by a developer typing `nix flake check` on a laptop, which
      # is how .bazelversion came to disagree with versions.nix without any lane noticing.
      #
      # Not --all-systems: the darwin attributes cannot build on a linux runner, and evaluating
      # them costs a full nixpkgs evaluation per system to prove nothing.
      #
      # First, not last. It is the step most likely to fail on a toolchain change, and failing
      # before the shell is realised keeps the feedback short.
      - name: nix flake check
        run: nix flake check --no-update-lock-file --show-trace --print-build-logs

      # The flake exposes nixfmt-tree as its formatter; this is what makes that more than a
      # declaration. `--ci` is treefmt's check mode — fail on change, no cache — and the wrapper
      # is what keeps the walk inside the repository rather than into .direnv and bazel-out.
      - name: nix fmt
        run: nix fmt -- --ci

      - name: actionlint
        run: nix develop .#ci-lint --command actionlint -color

      - name: yamllint
        run: nix develop .#ci-lint --command yamllint --strict .

      - name: Protobuf schema lint
        run: nix develop .#ci-lint --command buf lint protocols

      # The temporary against-config also makes the first migration from the
      # previous placeholder buf.yaml comparable. It describes the base tree's
      # location only; the FILE compatibility policy remains authoritative in
      # the proposed tree's protocols/buf.yaml.
      - name: Protobuf breaking-change detection
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git branch --force buf-breaking-base "${BASE_SHA}"
          nix develop .#ci-lint --command buf breaking protocols \
            --against ".git#branch=buf-breaking-base" \
            --against-config \
            '{"version":"v2","modules":[{"path":"protocols/proto"}]}'

      - name: Buildkite credential helper shellcheck
        run: nix develop .#ci-lint --command shellcheck .buildkite/scripts/wif-preflight.sh

      - name: Strict documentation build
        run: nix develop .#ci-lint --command mkdocs build -f docs/mkdocs.yml --strict

      - name: Validate canonical repository home policy
        uses: mindclade/.github/actions/validate-repository-home@8467615f12868d4b78718b8ddf7f05797c44a507

      # The monorepo validator deliberately enforces additional architecture and documentation
      # contracts. It is not a byte mirror of the estate action and remains the offline authority
      # for those repository-specific extensions.
      - name: Validate monorepo repository-home extensions
        run: nix develop .#ci-lint --command python3 tools/docs/validate_repository_home.py --root .

  # ---------------------------------------------------------------------------------------
  # Terraform — infra/terraform
  # ---------------------------------------------------------------------------------------
  # This is not a monorepo-internal concern. infrastructure-live consumes every module under
  # infra/terraform/modules BY SEMVER TAG, so a module that does not validate here breaks a
  # different repository's plan — and it breaks it at a tag, after the merge, with the error
  # surfacing in a repo whose diff shows nothing.
  #
  # `terraform test` is the part worth having. The .tftest.hcl suites run against a mock
  # provider, so this needs no credentials and reaches no cloud.
  #
  # environments/* are ROOT modules and are covered too. They are not consumed by
  # infrastructure-live, but dns_hub is the first thing applied in a new estate and holds the
  # delegation for every domain the company owns — the blast radius of it being wrong is the
  # whole estate, not one module's callers.
  terraform:
    name: terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MINDCLADE_TF_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Interface governance compares generated evidence to the pull request's real base.
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare GitHub-hosted runner disk for Nix
        run: ci/common/prepare_nix_runner.sh

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      # The exact key has no restore prefix. Untrusted pull requests can consume only a cache
      # created from the same toolchain and lock evidence, and cannot publish a cache that a
      # trusted main-branch run will later consume. Terraform still verifies every provider
      # package against the committed lock checksums.
      - name: Restore exact Terraform provider cache
        id: terraform-provider-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/mindclade-terraform-plugin-cache
          key: tf-google-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'tools/build/nix/toolchain-manifest.json', 'infra/terraform/provider-compatibility.toml', 'infra/terraform/locks/*.hcl', 'infra/terraform/**/.terraform.lock.hcl') }}

      # Each phase enters Nix once. check.sh owns serial initialization and four-way bounded
      # execution, so adding a module no longer adds three more full dev-shell startups.
      - name: Terraform formatting
        run: nix develop .#ci-terraform --command ci/terraform/check.sh fmt

      - name: Terraform module and provider contracts
        run: nix develop .#ci-terraform --command ci/terraform/check.sh contracts

      - name: Backendless Terraform initialization and validation
        run: nix develop .#ci-terraform --command ci/terraform/check.sh validate

      - name: TFLint
        run: nix develop .#ci-terraform --command ci/terraform/check.sh lint

      - name: IaC security and policy fixtures
        run: nix develop .#ci-terraform --command ci/terraform/check.sh security

      - name: Mock-provider Terraform tests
        run: nix develop .#ci-terraform --command ci/terraform/check.sh test

      - name: Terraform documentation and public interfaces
        env:
          TERRAFORM_INTERFACE_BASE_REF: "${{ github.event.pull_request.base.sha || github.event.before }}"
        run: nix develop .#ci-terraform --command ci/terraform/check.sh docs

      - name: Google provider compatibility matrix
        run: nix develop .#ci-terraform --command ci/terraform/check.sh compat

      # Save only after every Terraform gate succeeds on the protected branch. Pull requests
      # never write the cache, which keeps their dependency bytes outside the trusted boundary.
      - name: Save trusted Terraform provider cache
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.terraform-provider-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/mindclade-terraform-plugin-cache
          key: tf-google-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'tools/build/nix/toolchain-manifest.json', 'infra/terraform/provider-compatibility.toml', 'infra/terraform/locks/*.hcl', 'infra/terraform/**/.terraform.lock.hcl') }}

  # ---------------------------------------------------------------------------------------
  # Bazel — formatting, loading, architecture, configured analysis, and tests
  # ---------------------------------------------------------------------------------------
  # Keep the phases separate. Loading gives the shortest diagnostic for malformed labels;
  # the graph checker reports architectural edges; --nobuild proves every external repository,
  # toolchain and configured target analyzes; test executes every non-manual test. A failure in
  # an earlier phase should not be buried under a later compiler traceback.
  #
  # Every Bazel command runs inside .#ci-bazel. The shell exports the immutable C/C++ bundle and
  # repository wrapper owns only launcher selection/root normalization. CI's lockfile_mode=error
  # makes committed Bzlmod extension state immutable during every configured phase.
  bazel:
    # Governance requires this exact stable context. Do not rename it without an evaluate-mode
    # ruleset migration and connected pull-request plus merge-group evidence.
    name: bazel / verdict
    runs-on: ubuntu-24.04
    # A cold hosted runner compiles the complete C++/protobuf tool graph before running tests.
    # Exact-head qualification reaches hundreds of tests and can spend most of a cold run
    # compiling the upstream C++/protobuf tool graph. Keep a bounded ceiling with enough room
    # for a cold cache; the BEP/profile artifact makes regressions diagnosable without a count
    # that drifts every time a test target is added.
    timeout-minutes: 90
    steps:
      - name: Record Bazel verdict start
        run: date +%s > "${RUNNER_TEMP}/bazel-job-started"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Affected mode validates and diffs the exact pull-request base. Missing history is a
          # hard selector error, never an empty target set.
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare GitHub-hosted runner disk for Nix
        run: ci/common/prepare_nix_runner.sh

      # Provides Bazel launcher/repository cache integration. setup-bazel's implicit action-output
      # cache remains disabled: it previously duplicated an unbounded output tree and exhausted the
      # runner. The bounded persistent action cache below is configured explicitly through the
      # repository's gitignored user.bazelrc, and only protected-main runs may publish it.
      # The repository cache keeps immutable source archives. The launcher itself comes from
      # .#ci-bazel as pkgs.bazel_9 and is verified against .bazelversion by tools/dev/bazelw;
      # the action-installed Bazelisk is a compatibility fallback, not toolchain authority.
      #
      # It was briefly held at 8.4.2 because rules_go 0.51 does not load under Bazel 9 —
      # `cross.bzl` uses APIs it removed. rules_go 0.63.0 lifted that, and the tree now loads
      # the complete graph under Bazel 9. The repository tracks the current active LTS minor
      # through .bazelversion and tools/build/nix/versions.nix.
      - uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8  # v0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      # buildifier comes from the flake, like every other linter in this repository, so the
      # version that gates a PR is the version `nix develop` gives you locally.
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      # Cache keys contain only committed toolchain/lock evidence and a trusted revision. Pull
      # requests use their protected base; merge groups use the queue's protected base; only a
      # protected-main push is a writer. The prefix fallback remains inside the exact toolchain
      # fingerprint, and GitHub's cache service resolves it from the default-branch scope.
      - name: Select trusted Bazel cache revision
        id: bazel-cache-trust
        env:
          CACHE_FINGERPRINT: ${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'REPO.bazel', 'flake.lock', 'tools/build/nix/toolchain-manifest.json') }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          python3 ci/common/bazel_disk_cache.py select-trust \
            --workflow presubmit \
            --event "${GITHUB_EVENT_NAME}" \
            --ref "${GITHUB_REF}" \
            --ref-protected "${REF_PROTECTED}" \
            --head-sha "${GITHUB_SHA}" \
            --fingerprint "${CACHE_FINGERPRINT}" \
            --runner-os "${RUNNER_OS}" \
            --runner-arch "${RUNNER_ARCH}" \
            --pull-request-base-sha "${PR_BASE_SHA}" \
            --pull-request-base-ref "${PR_BASE_REF}" \
            --merge-group-base-sha "${MERGE_GROUP_BASE_SHA}" \
            --merge-group-base-ref "${MERGE_GROUP_BASE_REF}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Restore trusted Bazel persistent action cache
        id: bazel-disk-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/mindclade-bazel-disk-cache
          key: ${{ steps.bazel-cache-trust.outputs.primary-key }}
          restore-keys: |
            ${{ steps.bazel-cache-trust.outputs.restore-prefix }}

      # user.bazelrc is already gitignored and try-imported by .bazelrc. This makes every Bazel
      # build/test invocation use the same cache contract without embedding runner paths in source.
      # Reader events never upload local results. The 4 GiB GC ceiling and one-second idle delay
      # bound the prior duplicate-output failure mode; zstd reduces the persisted archive further.
      - name: Configure bounded Bazel persistent action cache
        env:
          BAZEL_CACHE_ROLE: ${{ steps.bazel-cache-trust.outputs.role }}
          BAZEL_CACHE_RESTORE_OUTCOME: ${{ steps.bazel-disk-cache.outcome }}
        run: |
          set -euo pipefail
          python3 ci/common/bazel_disk_cache.py configure \
            --cache-dir "${RUNNER_TEMP}/mindclade-bazel-disk-cache" \
            --workspace "${GITHUB_WORKSPACE}" \
            --bazelrc "${GITHUB_WORKSPACE}/user.bazelrc" \
            --role "${BAZEL_CACHE_ROLE}" \
            --github-env "${GITHUB_ENV}" \
            --restore-outcome "${BAZEL_CACHE_RESTORE_OUTCOME}"

      # Reads .buildifier.json: format plus a 39-warning lint set, narrower than buildifier's
      # default `all`. Every name in that file has to be one this buildifier knows — an
      # unrecognised name makes it exit 1 before reading a single file, with a message about
      # configuration rather than about code.
      - name: buildifier
        run: nix develop .#ci-bazel --command buildifier --mode=check -r .

      - name: Every BUILD file loads and every label resolves
        run: >-
          nix develop .#ci-bazel --command
          tools/dev/bazelw query '//...' --config=ci --output=label
          > /dev/null

      - name: Prove affected selection against the real Bazel graph
        run: >-
          nix develop .#ci-bazel --command
          python3 ci/common/validate_affected_integration.py

      - name: Enforce Bazel dependency layers
        run: nix develop .#ci-bazel --command python3 tools/analysis/check_bazel_layers.py

      - name: Validate and resolve the registered C/C++ toolchain
        run: |
          nix develop .#ci-bazel --command python3 tools/analysis/validate_cc_toolchain_bundle.py
          nix develop .#ci-bazel --command tools/dev/bazelw test \
            //tools/build/bazel/toolchains/cc:smoke_test --config=ci
          nix develop .#ci-bazel --command python3 tools/analysis/verify_cc_toolchain_selection.py

      - name: Run affected or protected full-graph Bazel validation
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The shared executor removes setup-bazel's short-lived download token from each
          # evidence-producing subprocess so neither analysis nor test BEP can record it.
          evidence="${RUNNER_TEMP}/bazel-evidence"
          mode="full"
          base_args=()
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            if [[ -z "${PR_BASE_SHA}" ]]; then
              echo "pull_request event is missing github.event.pull_request.base.sha" >&2
              exit 2
            fi
            mode="affected"
            base_args=(--base "${PR_BASE_SHA}")
          fi
          nix develop .#ci-bazel --command python3 ci/presubmit/pipeline.py \
            --bazel-only \
            --mode "${mode}" \
            "${base_args[@]}" \
            --event "${GITHUB_EVENT_NAME}" \
            --evidence-dir "${evidence}" \
            --job-started-at-file "${RUNNER_TEMP}/bazel-job-started"

      - name: Measure bounded Bazel persistent action cache
        id: bazel-cache-size
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          nix develop .#ci-bazel --command python3 ci/common/bazel_disk_cache.py measure \
            --cache-dir "${RUNNER_TEMP}/mindclade-bazel-disk-cache" \
            --workspace "${GITHUB_WORKSPACE}" \
            --bazel-wrapper "${GITHUB_WORKSPACE}/tools/dev/bazelw" \
            --gc-wait-seconds 3 \
            --github-output "${GITHUB_OUTPUT}"

      # Cache entries are immutable. A prefix restore on a new protected-main revision is saved
      # under that exact head; pull-request and merge-group refs never publish cache contents.
      - name: Save trusted Bazel persistent action cache
        id: bazel-cache-save
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.ref_protected == true &&
          steps.bazel-cache-trust.outputs.role == 'writer' &&
          steps.bazel-disk-cache.outputs.cache-hit != 'true' &&
          steps.bazel-cache-size.outputs.within-limit == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/mindclade-bazel-disk-cache
          key: ${{ steps.bazel-cache-trust.outputs.primary-key }}

      - name: Record Bazel persistent action cache metrics
        if: always()
        env:
          CACHE_ROLE: ${{ steps.bazel-cache-trust.outputs.role }}
          CACHE_REVISION: ${{ steps.bazel-cache-trust.outputs.revision }}
          CACHE_PRIMARY_KEY: ${{ steps.bazel-cache-trust.outputs.primary-key }}
          CACHE_RESTORE_PREFIX: ${{ steps.bazel-cache-trust.outputs.restore-prefix }}
          CACHE_MATCHED_KEY: ${{ steps.bazel-disk-cache.outputs.cache-matched-key }}
          CACHE_EXACT_HIT: ${{ steps.bazel-disk-cache.outputs.cache-hit }}
          CACHE_RESTORE_OUTCOME: ${{ steps.bazel-disk-cache.outcome }}
          CACHE_SIZE_BYTES: ${{ steps.bazel-cache-size.outputs.size-bytes }}
          CACHE_WITHIN_LIMIT: ${{ steps.bazel-cache-size.outputs.within-limit }}
          CACHE_MEASURE_OUTCOME: ${{ steps.bazel-cache-size.outcome }}
          CACHE_SAVE_OUTCOME: ${{ steps.bazel-cache-save.outcome }}
        run: |
          set -euo pipefail
          python3 ci/common/bazel_disk_cache.py record-metrics \
            --evidence-dir "${RUNNER_TEMP}/bazel-evidence" \
            --summary "${GITHUB_STEP_SUMMARY}" \
            --role "${CACHE_ROLE}" \
            --trusted-revision "${CACHE_REVISION}" \
            --primary-key "${CACHE_PRIMARY_KEY}" \
            --matched-key "${CACHE_MATCHED_KEY}" \
            --exact-hit "${CACHE_EXACT_HIT}" \
            --save-outcome "${CACHE_SAVE_OUTCOME}" \
            --size-bytes "${CACHE_SIZE_BYTES}" \
            --within-limit "${CACHE_WITHIN_LIMIT}" \
            --restore-prefix "${CACHE_RESTORE_PREFIX}" \
            --restore-outcome "${CACHE_RESTORE_OUTCOME}" \
            --measure-outcome "${CACHE_MEASURE_OUTCOME}"

      - name: Upload Bazel performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: bazel-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bazel-evidence/*
          if-no-files-found: warn
          retention-days: 35

      - name: Upload Bazel latency metric
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: bazel-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bazel-evidence/run-metrics.json
          if-no-files-found: ignore
          retention-days: 35

  # Stable, always-reported infrastructure context. Do not add path filters or rename the job:
  # branch protection can require `infra-static` without creating a check that disappears on
  # documentation-only pull requests. Nix owns CLI versions; Bazel owns declared inputs, local
  # schemas, rendering, policy, relational validation, and test result reporting.
  infra-static:
    name: infra-static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare GitHub-hosted runner disk for Nix
        run: ci/common/prepare_nix_runner.sh

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      - name: Pinned Kubernetes and GitOps static validation
        run: >-
          nix develop .#ci-infra --command
          tools/dev/bazelw test --config=ci
          //infra/kubernetes:validate //infra/gitops:validate
          --test_output=errors

      - name: Fail-closed Buildkite WIF source contract
        run: |
          nix develop .#ci-infra --command python3 -B .buildkite/scripts/validate_wif_contract.py
          nix develop .#ci-infra --command python3 -B -m unittest discover \
            -s .buildkite/tests -p 'test_*.py'


  # ---------------------------------------------------------------------------------------
  # TypeScript / pnpm
  # ---------------------------------------------------------------------------------------
  # Native TypeScript 7 compiles the SDK, shared libraries, and application source. Next uses
  # the package-local TypeScript 6 compatibility API only for programmatic route generation.
  # Generation, tests, architecture checks, and optimized application builds all fail closed.
  typescript:
    name: TypeScript contracts, tests, and production builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # package.json remains the single pnpm-version authority. v6 runs on Node 24, avoiding
      # GitHub's deprecated Node 20 action shim while retaining the approved action identity.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6
        with:
          node-version: "22.16.0"
          cache: pnpm

      # --frozen-lockfile is the assertion: it fails if the lockfile does not match the
      # manifests rather than quietly updating it, which is what a local `pnpm install` does.
      - name: Lockfile matches the manifests
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Every workspace package exists
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            # A glob that matches nothing means a workspace entry with no package behind it.
            matches=0
            for dir in $pattern; do
              [ -d "$dir" ] || continue
              matches=$((matches + 1))
              if [ ! -f "$dir/package.json" ]; then
                echo "::error file=$dir::workspace member has no package.json"
                failed=1
              fi
            done
            if [ "$matches" -eq 0 ]; then
              echo "::error file=pnpm-workspace.yaml::pattern '$pattern' matches no directory"
              failed=1
            fi
          done < <(grep -oE '^\s+- "[^"]+"' pnpm-workspace.yaml | sed -E 's/.*"(.*)"/\1/')
          exit "$failed"

      - name: Generated clients match canonical contracts
        run: pnpm run generate:check

      - name: Architecture and native TypeScript 7 checks
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Optimized SDK, library, and Next builds
        run: pnpm run build

      - name: Install pinned accessibility browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: WCAG 2.1 AA browser accessibility
        run: pnpm run test:accessibility
