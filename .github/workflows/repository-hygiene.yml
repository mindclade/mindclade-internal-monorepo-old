---

name: Repository hygiene report

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: branch and worktree preservation report
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.14.7"

      - name: Generate report-only preservation evidence
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/repository-hygiene"
          python3 -B tools/dev/git_hygiene_report.py \
            --root "${GITHUB_WORKSPACE}" \
            --baseline refs/remotes/origin/main \
            --json-output "${output}/repository-hygiene.json" \
            --html-output "${output}/repository-hygiene.html"

      - name: Upload repository hygiene report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: repository-hygiene-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repository-hygiene/*
          if-no-files-found: error
          retention-days: 35
