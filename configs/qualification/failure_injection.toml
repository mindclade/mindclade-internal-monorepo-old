schema_version = 2

[[scenario]]
name = "worker_killed_before_artifact_commit"
invariant = "no_partial_artifact"
owner = "runtime-platform"
command = ["cargo", "test", "-p", "mindclade_worker_runtime", "--test", "failure_injection", "kill_before_commit", "--locked", "--", "--exact"]

