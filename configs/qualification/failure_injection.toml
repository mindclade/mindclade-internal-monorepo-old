name = "worker_killed_after_upload_before_ack"
invariant = "idempotent_recovery"
owner = "runtime-platform"
command = ["cargo", "test", "-p", "mindclade_worker_runtime", "--test", "failure_injection", "kill_after_commit_before_ack", "--locked", "--", "--exact"]

[[scenario]]
