#
# Bazel downloader allowlist, loaded by --experimental_downloader_config. Only
# `--config=hermetic` in .bazelrc passes that flag, and no lane sets it yet; see the comment
# there for why enabling it before the mirror exists breaks every fetch.
#
# WHAT THIS IS FOR. Bazel's downloader will fetch any URL a module or repository rule names.
# For a build whose outputs get signed and attested, that is the widest input surface in the
# system: a dependency that moves, or a registry that is compromised, changes the bytes of an
# image nobody re-reviewed. This file names the hosts a fetch is allowed to reach, and blocks
# the rest — so an added dependency pointing somewhere new fails loudly at fetch time rather
# than succeeding quietly.
#
# SYNTAX (bazel/repository/downloader/UrlRewriterConfig):
#   allow <host-suffix>        permit fetches from this host
#   block <host-suffix>        refuse fetches from this host
#   rewrite <pattern> <repl>   rewrite a matching URL, e.g. to point at an internal mirror
#   all_blocked_message <text> printed when a fetch is refused
# Rules are matched against the URL host. `rewrite` uses RE2 with $1-style group references.

all_blocked_message Fetch blocked by bazel_downloader.cfg. This build runs with --config=hermetic, which restricts external fetches to the registries below. If the dependency is legitimate, add its host here in the same commit that adds the dependency, and say in the message why the existing registries could not serve it.

# ---------------------------------------------------------------------------------------
# Bazel Central Registry and the modules MODULE.bazel declares
# ---------------------------------------------------------------------------------------
# BCR serves the registry metadata; the source archives it points at live on GitHub releases
# for every bazel_dep currently declared (rules_go, gazelle, rules_python, rules_rust,
# rules_oci, protobuf).
allow bcr.bazel.build
allow github.com
allow raw.githubusercontent.com
allow objects.githubusercontent.com
allow release-assets.githubusercontent.com

# Bazel's own mirror, which BCR entries frequently list first.
allow mirror.bazel.build

# ---------------------------------------------------------------------------------------
# Language toolchains and package registries
# ---------------------------------------------------------------------------------------
# Go modules, via the gazelle go_deps extension reading //:go.mod.
allow proxy.golang.org
allow sum.golang.org
allow storage.googleapis.com

# Rust crates, via the rules_rust crate_universe extension reading //:Cargo.lock. static.
# crates.io is where the .crate archives actually come from; crates.io serves only the index.
allow crates.io
allow static.crates.io
allow index.crates.io

# Python wheels, via rules_python.
allow pypi.org
allow files.pythonhosted.org

# Container base images, via rules_oci. These are the registries services/go_vanity/Dockerfile
# pins by digest.
allow gcr.io
allow ghcr.io
allow registry-1.docker.io
allow auth.docker.io

# ---------------------------------------------------------------------------------------
# Internal mirror
# ---------------------------------------------------------------------------------------
# NOT ENABLED. When the mirror described in QUALIFICATION.md's build/release lane is stood up,
# uncomment the rewrite below and REMOVE the public allow rules above it — a rewrite that
# coexists with a public allow is not a mirror, it is a fallback, and a fallback means the
# build silently reaches the public host on the day the mirror is down. That is the failure
# the mirror exists to prevent.
#
# rewrite (.*)/(.*) https://mirror.mindclade.internal/$1/$2
