# ---------------------------------------------------------------------------------------
# Newly declared components
# ---------------------------------------------------------------------------------------
# check_component_ownership.py requires a 1:1 mapping with components.toml in both
# directions, so every entry registered there needs its metadata here.
#
# All are tier-2. Tier-0 and tier-1 in this file mean a deployed surface with an SLO and a
# runbook on it; these are libraries and reserved packages, and claiming a tier that
# implies operational evidence they do not have would be the same dishonesty as inflating
# a maturity status.

# `evaluation/biological_risk/`, `evaluation/privacy/` and `evaluation/safety/` are inside
# this boundary, and CODEOWNERS already pairs biological_risk with security. The scaffold is
# empty today, but the review requirement is a property of the boundary, not of how much
# code currently sits behind it.
[component."evaluation"]
owner = "training-platform"
criticality = "tier-2"
language = "python"
security_review = true

[component."kernels"]
owner = "biology-ml"
criticality = "tier-2"
language = "python"
security_review = false

[component."data"]
owner = "data-platform"
criticality = "tier-2"
language = "python"
security_review = false

