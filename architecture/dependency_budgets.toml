[[budget]]
path = "services/control_plane"
language = "go"
# Replaces a single "services" budget that summed distinct import paths across
# every Go service in the tree. That number could not constrain anything: it
# moved when studio grew, and it sat at exactly 40 when the control plane
# imported almost nothing, so the first materialized provider factory was
# guaranteed to breach it while every real invariant stayed unexpressed.
#
# NO max_internal_direct, and that is the point rather than an omission.
#
# The count went 40 -> 44 -> 62 -> 68 as the registry, scheduler, controller,
# and projector factories materialized, breaching the ceiling three times in
# one branch. Each breach was resolved by raising the number, which is the
# tell: a composition root's job is to name every provider the fleet uses, so
# counting them measures how much of the fleet exists, not whether the design
# holds. Six roles remain unmaterialized; the number will move six more times
# and reject nothing on the way.
#
# The allowlist is the invariant worth having, and it is enforced here: a
# control-plane package may reach the shared foundation, domain policy under
# control/, and its own subtree. Nothing else -- and in particular no other
# service. Counts belong on the subtrees below, where breadth is a defect
# rather than a milestone.
allowed_prefixes = [
    "go.mindclade.dev/libs/go/",
    "go.mindclade.dev/control/",
    "go.mindclade.dev/protocols/servicepolicy",
    "go.mindclade.dev/services/control_plane/",
]
forbidden_prefixes = ["go.mindclade.dev/services/studio/", "go.mindclade.dev/apps/"]

# The subtree budgets below carry the counts. Every one of them constrains a
# package whose breadth is a defect: bootstrap and config must not learn about
# providers, the aggregates must track the capability vocabulary rather than
# grow with it, and transport must not become a second composition root.
#
# internal/providers deliberately has no count. It is the composition root and
# is supposed to name every adapter the fleet runs.

[[budget]]
path = "services/control_plane/internal/bootstrap"
language = "go"
# 3 today. Bootstrap owns roles, profiles, and capability assembly, and must
# stay provider-agnostic: it may not learn what a database or a cluster is.
# A jump here means process assembly has started naming concrete mechanisms.
# Bootstrap owns roles, profiles, and capability assembly and must stay
# provider-agnostic: it may not learn what a database or a cluster is.
#
# Verified today: bootstrap imports 3 distinct paths, all under libs/go. The
# denials below therefore cost nothing now and are here to keep it that way.
forbidden_prefixes = [
    "go.mindclade.dev/services/control_plane/internal/providers",
    "go.mindclade.dev/services/control_plane/internal/transport",
    "go.mindclade.dev/services/control_plane/internal/foundation",
    "go.mindclade.dev/services/studio",
    "go.mindclade.dev/apps/",
]

[[budget]]
path = "services/control_plane/internal/config"
language = "go"
# 3 today. Configuration decodes settings and validates them. It has no
# business importing a provider, a store, or a transport.
# Configuration decodes settings and validates them. It has no business
# importing a provider, a store, or a transport.
#
# Verified today: 3 distinct imports, all under libs/go. This is the narrowest
# layer in the service and the one where a new import is most worth reading.
forbidden_prefixes = [
    "go.mindclade.dev/services/control_plane/internal/providers",
    "go.mindclade.dev/services/control_plane/internal/transport",
    "go.mindclade.dev/services/control_plane/internal/bootstrap",
    "go.mindclade.dev/services/control_plane/internal/foundation",
    "go.mindclade.dev/services/studio",
    "go.mindclade.dev/apps/",
]

[[budget]]
path = "services/control_plane/internal/foundation"
language = "go"
# 30 today. Each aggregate binds one group of libs/go contracts to the
# capabilities they satisfy, so this tracks the production capability
# vocabulary and grows only when that vocabulary does -- roughly one import
# per contract. Materializing a role must not move it at all.
# Each aggregate binds one group of libs/go contracts to the capabilities
# they satisfy. Binding a CONTRACT is the job; binding a concrete adapter
# is what internal/providers is for.
#
# Verified today: 30 distinct imports — 29 under libs/go plus its own parent
# package, which the 10 subpackages each import. No sibling edge exists, and
# the denials keep it that way. This is the entry the old count guarded with
# `36`, a number that tracked the size of the capability vocabulary rather
# than any property of the design.
forbidden_prefixes = [
    "go.mindclade.dev/services/control_plane/internal/providers",
    "go.mindclade.dev/services/control_plane/internal/transport",
    "go.mindclade.dev/services/control_plane/internal/bootstrap",
    "go.mindclade.dev/services/control_plane/internal/config",
    "go.mindclade.dev/services/studio",
    "go.mindclade.dev/apps/",
]

[[budget]]
path = "services/control_plane/internal/transport"
language = "go"
# 8 today. Transport wires the inbound stack. Provider construction belongs in
# internal/providers, and a climb here is the sign it leaked.
# Transport wires the inbound stack. Provider construction belongs in
# internal/providers, and an import from here is the sign it leaked --
# which is the "transport must not become a second composition root"
# invariant, stated as a rule rather than as a number.
#
# transport -> bootstrap is DELIBERATELY not forbidden. It exists today at
# three sites (bundle.go, http.go, grpc.go): transport asks bootstrap for the
# assembled capability set rather than assembling one itself, which is the
# direction that keeps it from becoming that second composition root. The edge
# the other way would be the defect, and bootstrap's own entry forbids it.
forbidden_prefixes = [
    "go.mindclade.dev/services/control_plane/internal/providers",
    "go.mindclade.dev/services/control_plane/internal/config",
    "go.mindclade.dev/services/studio",
    "go.mindclade.dev/apps/",
]

[[budget]]
path = "services/go_vanity"
language = "go"
# Internal packages only and nothing shared. The ceiling exists so that adopting
# a foundation package is a visible, reviewed step rather than a silent one.
allowed_prefixes = ["go.mindclade.dev/libs/go/", "go.mindclade.dev/services/go_vanity/"]
forbidden_prefixes = ["go.mindclade.dev/control/", "go.mindclade.dev/services/control_plane/"]

[[budget]]
path = "services/studio"
language = "go"
# studio was outside the Bazel graph and outside this file entirely, which is
# how it reached production importing NOTHING from libs/go: nothing measured it,
# so nothing noticed. Eleven counted paths today — three shared packages plus its
# own eight internal ones, which this checker counts alongside them.
#
# The ceiling has room for the shared packages studio still duplicates locally
# (internal/httpx against libs/go/httpx, internal/session and internal/iap
# against libs/go/auth). Adopting one should RAISE this number while deleting
# code; if it ever needs raising for a reason other than that, the reason is
# worth reading twice.
allowed_prefixes = ["go.mindclade.dev/libs/go/", "go.mindclade.dev/services/studio/"]
forbidden_prefixes = ["go.mindclade.dev/services/control_plane/", "go.mindclade.dev/control/"]

