# ---------------------------------------------------------------------------
# TypeScript
# ---------------------------------------------------------------------------
# Zero internal edges today: not one package.json in the tree declares another
# @mindclade/* package. These entries therefore reject nothing right now, and
# that is the reason to write them NOW rather than later.
#
# The precedent is services/studio above. It sat outside this file entirely and
# reached production importing nothing from libs/go — duplicating httpx, session
# and iap locally — because nothing measured it, so nothing noticed. The rule
# that arrives after the edges exist has to argue with working code; the rule
# that arrives first is just the shape of the tree.
#
# Read from package.json rather than from import sites: an `import` can name a
# path alias, a relative path, or the package, which is three spellings of one
# edge. The manifest is also what pnpm enforces — a package not declared there
# does not resolve — so it is the boundary rather than a description of one.

[[budget]]
path = "apps/admin"
language = "typescript"
# An app composes libs and the SDK. It must not reach into another app: two
# front-ends sharing code means the code is shared, and shared code belongs in
# libs/ts where both can depend on it without depending on each other.
allowed_prefixes = ["@mindclade/libs-ts", "@mindclade/sdk-typescript"]
forbidden_prefixes = ["@mindclade/apps-"]

[[budget]]
path = "apps/console"
language = "typescript"
allowed_prefixes = ["@mindclade/libs-ts", "@mindclade/sdk-typescript"]
forbidden_prefixes = ["@mindclade/apps-"]

[[budget]]
path = "sdk/typescript"
language = "typescript"
# The published client. It may not depend on libs/ts or on an app: everything
# it imports becomes a transitive dependency of every external consumer, and
# libs/ts is internal UI machinery that has no business in a customer's
# node_modules.
forbidden_prefixes = ["@mindclade/apps-", "@mindclade/libs-ts"]

[[budget]]
path = "libs/ts/api_client"
language = "typescript"
# The lowest TS layer. It speaks to the API and knows nothing about rendering.
forbidden_prefixes = ["@mindclade/apps-", "@mindclade/libs-ts-design-system", "@mindclade/libs-ts-charts", "@mindclade/libs-ts-molecular-viewer"]

[[budget]]
path = "libs/ts/auth"
language = "typescript"
forbidden_prefixes = ["@mindclade/apps-", "@mindclade/libs-ts-design-system", "@mindclade/libs-ts-charts", "@mindclade/libs-ts-molecular-viewer"]

[[budget]]
path = "libs/ts/telemetry"
language = "typescript"
forbidden_prefixes = ["@mindclade/apps-", "@mindclade/libs-ts-design-system", "@mindclade/libs-ts-charts", "@mindclade/libs-ts-molecular-viewer"]

[[budget]]
path = "libs/ts/design_system"
language = "typescript"
# Presentation primitives. A design system that fetches is a design system with
# a runtime dependency on a network, which makes every component untestable in
# isolation and every story a mock.
forbidden_prefixes = ["@mindclade/apps-", "@mindclade/libs-ts-api-client", "@mindclade/libs-ts-auth"]

[[budget]]
path = "libs/ts/charts"
language = "typescript"
forbidden_prefixes = ["@mindclade/apps-", "@mindclade/libs-ts-api-client", "@mindclade/libs-ts-auth"]

[[budget]]
