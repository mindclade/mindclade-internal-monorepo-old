schema_version = 1

[[budget]]
path = "libs/go/faults"
language = "go"
max_internal_direct = 0
forbidden_prefixes = ["go.mindclade.dev/control/", "go.mindclade.dev/services/"]

[[budget]]
path = "libs/go/servicekit"
language = "go"
max_internal_direct = 3
allowed_prefixes = ["go.mindclade.dev/libs/go/clock", "go.mindclade.dev/libs/go/faults", "go.mindclade.dev/libs/go/servicekit"]

[[budget]]
path = "control/runtime_authority"
language = "go"
max_internal_direct = 5
allowed_prefixes = ["go.mindclade.dev/libs/go/"]
forbidden_prefixes = ["go.mindclade.dev/services/"]

[[budget]]
path = "control"
language = "go"
max_internal_direct = 20
forbidden_prefixes = ["go.mindclade.dev/services/", "go.mindclade.dev/apps/"]

[[budget]]
path = "services"
language = "go"
max_internal_direct = 40

[[budget]]
path = "services/studio"
language = "go"
# studio was outside the Bazel graph and outside this file entirely, which is
# how it reached production importing NOTHING from libs/go: nothing measured it,
# so nothing noticed. Eleven counted paths today — three shared packages plus its
# own eight internal ones, which this checker counts alongside them.
#
# The ceiling has room for the shared packages studio still duplicates locally
# (internal/httpx against libs/go/httpx, internal/session and internal/iap
# against libs/go/auth). Adopting one should RAISE this number while deleting
# code; if it ever needs raising for a reason other than that, the reason is
# worth reading twice.
max_internal_direct = 16
allowed_prefixes = ["go.mindclade.dev/libs/go/", "go.mindclade.dev/services/studio/"]
forbidden_prefixes = ["go.mindclade.dev/services/control_plane/", "go.mindclade.dev/control/"]

[[budget]]
path = "libs/rust/runtime_core"
language = "rust"
max_internal_direct = 2
allowed_prefixes = ["mindclade_faults", "mindclade_content_digest"]

[[budget]]
path = "libs/rust/worker_runtime"
language = "rust"
max_internal_direct = 5
allowed_prefixes = ["mindclade_faults", "mindclade_runtime_core", "mindclade_worker_protocol"]

[[budget]]
path = "services/runtime_gateway"
language = "rust"
max_internal_direct = 9
allowed_prefixes = ["mindclade_content_digest", "mindclade_faults", "mindclade_identifiers", "mindclade_protocols", "mindclade_runtime_core", "mindclade_servicekit", "mindclade_serving_runtime", "mindclade_telemetry", "mindclade_worker_protocol"]

[[budget]]
path = "services/runtime_host"
language = "rust"
max_internal_direct = 12
allowed_prefixes = ["mindclade_bytes_io", "mindclade_faults", "mindclade_gpu_host", "mindclade_ipc", "mindclade_ipc_os", "mindclade_protocols", "mindclade_runtime_core", "mindclade_servicekit", "mindclade_serving_runtime", "mindclade_telemetry", "mindclade_worker_protocol", "mindclade_worker_runtime"]
