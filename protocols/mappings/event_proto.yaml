---
# Event <-> protobuf projection policy.
#
# tools/codegen/generate_jsonschema.py reads this file together with the governed descriptor
# surface named below and writes every schema under protocols/events/generated/. Those files are
# derived output: edit this policy or the .proto, never the generated JSON.
#
# The descriptor decides STRUCTURE — which fields exist, their protobuf types, their field
# numbers. This file may only REFINE what the descriptor already says (tighten a range, add a
# pattern, declare which fields are required on the wire). It cannot add a property the message
# does not have, contradict a projected JSON type, or widen a protobuf range; the generator
# rejects all three. That asymmetry is what makes a dropped or retyped proto field a build
# failure instead of a silent producer/consumer disagreement.
#
# Every refinement below is a bound the protobuf type does not carry. The generator REQUIRES a
# bound for each unbounded projection — `maxLength` for string and bytes, `maxItems` for
# repeated, and both `minimum` and `maximum` for 64-bit integers, which JSON numbers cannot
# represent past 2^53-1. An unbounded wire field is a parser with no limit.
#
# `payload_messages` is what widens a domain union from "accepts nothing" to a closed list of
# payload shapes. orchestration/v1 is the first domain to declare one. Its four messages mirror
# the structs that services/control_plane/internal/store/postgres/orchestration/events.go
# marshals with encoding/json, so every bound here is copied from the Go validator that decides
# what the store will emit, not invented:
#
#   identifier patterns    identifiers.ParseID plus the kind control/orchestration requires of
#                          the field (`run`, `job`, `stage`, `workflow`, `ticket`); the payload
#                          is 32 lowercase hexadecimal UUIDv7 characters.
#   resource_version       resourceversion.Version.String() — "rv1:<generation>:sha256:<64 hex>",
#                          generation a non-zero uint64 with no leading zero.
#   state / origin         the closed lowercase vocabularies of control/orchestration's
#                          StageState, AttemptState, and CancellationOrigin. They are patterns
#                          rather than proto enums because proto3 JSON writes an enum as its
#                          declared NAME and the store writes the domain word; see the header of
#                          protocols/proto/mindclade/orchestration/v1/orchestration_events.proto.
#   name / execution_class MaximumOutputNamespaceLength and MaximumResourceClassLength (128).
#   reason                 MaximumReasonLength (1024).
#   failure_code/_reason   coordination.MaximumFailureReasonLength (128) and the canonicalReason
#                          grammar. Members are deliberately NOT pinned: that taxonomy belongs to
#                          libs/go/faults, and pinning it here would make an orchestration schema
#                          the gate on a fault-code addition.
#   idempotency_scope/key  idempotency.MaximumScopeLength (256) / MaximumKeyLength (200) and
#                          their minimums (3 / 8). Scope must start with a lowercase letter and
#                          may not repeat or end on one of `._:/-`; a key is printable ASCII.
#   stage_count            orchestration.MaximumStageCount (4096), and at least one stage, which
#                          Workflow.Validate requires of anything publishable.
#
# `attempts`, `attempt` beyond its non-zero minimum, and both timestamps carry no refinement:
# uint32 and google.protobuf.Timestamp are already bounded by their projections.
{
  "schema_version": 1,
  "descriptor_surface": "protocols/compatibility/protobuf-v1-descriptor.json",
  "output_root": "protocols/events/generated",
  "id_prefix": "https://schemas.mindclade.dev/events/",
  "messages": {
    "mindclade.events.v1.EventEnvelope": {
      "title": "Mindclade durable event envelope",
      "required": [
        "event_id",
        "schema",
        "tenant_id",
        "aggregate_kind",
        "aggregate_id",
        "aggregate_version",
        "ordering_key",
        "occurred_at_unix_millis",
        "payload_type",
        "payload",
        "payload_digest"
      ],
      "fields": {
        "aggregate_id": {"maxLength": 256, "minLength": 1},
        "aggregate_kind": {"maxLength": 128, "minLength": 1},
        "aggregate_version": {"maximum": 9007199254740991, "minimum": 1},
        "causation_id": {"maxLength": 256},
        "correlation_id": {"maxLength": 256},
        "event_id": {"maxLength": 36, "pattern": "^evt_[0-9a-f]{32}$"},
        "occurred_at_unix_millis": {"maximum": 9007199254740991, "minimum": 1},
        "ordering_key": {"maxLength": 256, "minLength": 1},
        "payload": {"maxLength": 1398104},
        "payload_digest": {"maxLength": 71, "pattern": "^sha256:[0-9a-f]{64}$"},
        "payload_type": {"maxLength": 256, "minLength": 1},
        "schema": {"maxLength": 256, "minLength": 1},
        "tenant_id": {"maxLength": 39, "pattern": "^tenant_[0-9a-f]{32}$"},
        "workspace_id": {"maxLength": 256}
      }
    },
    "mindclade.orchestration.v1.AttemptStateEvent": {
      "title": "Mindclade orchestration attempt state event",
      "required": [
        "schema_version",
        "run_id",
        "job_id",
        "stage_id",
        "attempt",
        "state",
        "fencing_token",
        "execution_ticket_id",
        "execution_class",
        "sequence",
        "updated_at",
        "resource_version"
      ],
      "fields": {
        "attempt": {"minimum": 1},
        "execution_class": {"maxLength": 128, "minLength": 1},
        "execution_ticket_id": {"maxLength": 39, "pattern": "^ticket_[0-9a-f]{32}$"},
        "failure_code": {"maxLength": 128, "pattern": "^[a-z0-9]+(?:_[a-z0-9]+)*$"},
        "failure_reason": {"maxLength": 128, "pattern": "^[a-z0-9]+(?:[._-][a-z0-9]+)*$"},
        "fencing_token": {"maximum": 9007199254740991, "minimum": 1},
        "job_id": {"maxLength": 36, "pattern": "^job_[0-9a-f]{32}$"},
        "resource_version": {"maxLength": 96, "pattern": "^rv1:[1-9][0-9]{0,19}:sha256:[0-9a-f]{64}$"},
        "run_id": {"maxLength": 36, "pattern": "^run_[0-9a-f]{32}$"},
        "schema_version": {"minimum": 1},
        "sequence": {"maximum": 9007199254740991, "minimum": 0},
        "stage_id": {"maxLength": 38, "pattern": "^stage_[0-9a-f]{32}$"},
        "state": {
          "maxLength": 10,
          "pattern": "^(created|starting|ready|leased|running|draining|committing|completed|recovering|cancelling|cancelled|failed)$"
        }
      }
    },
    "mindclade.orchestration.v1.CancellationRequestedEvent": {
      "title": "Mindclade orchestration cancellation request event",
      "required": [
        "schema_version",
        "run_id",
        "origin",
        "reason",
        "idempotency_scope",
        "idempotency_key",
        "requested_at"
      ],
      "fields": {
        "idempotency_key": {"maxLength": 200, "minLength": 8, "pattern": "^[!-~]+$"},
        "idempotency_scope": {
          "maxLength": 256,
          "minLength": 3,
          "pattern": "^[a-z][a-z0-9]*(?:[._:/-][a-z0-9]+)*$"
        },
        "origin": {
          "maxLength": 10,
          "pattern": "^(client|operator|claim_loss|deadline|preemption)$"
        },
        "reason": {"maxLength": 1024, "minLength": 1},
        "run_id": {"maxLength": 36, "pattern": "^run_[0-9a-f]{32}$"},
        "schema_version": {"minimum": 1},
        "stage_id": {"maxLength": 38, "pattern": "^stage_[0-9a-f]{32}$"}
      }
    },
    "mindclade.orchestration.v1.StageStateEvent": {
      "title": "Mindclade orchestration stage state event",
      "required": [
        "schema_version",
        "run_id",
        "job_id",
        "stage_id",
        "state",
        "attempts",
        "updated_at",
        "resource_version"
      ],
      "fields": {
        "job_id": {"maxLength": 36, "pattern": "^job_[0-9a-f]{32}$"},
        "resource_version": {"maxLength": 96, "pattern": "^rv1:[1-9][0-9]{0,19}:sha256:[0-9a-f]{64}$"},
        "run_id": {"maxLength": 36, "pattern": "^run_[0-9a-f]{32}$"},
        "schema_version": {"minimum": 1},
        "stage_id": {"maxLength": 38, "pattern": "^stage_[0-9a-f]{32}$"},
        "state": {
          "maxLength": 10,
          "pattern": "^(blocked|queued|preparing|running|succeeded|failed|cancelling|cancelled)$"
        }
      }
    },
    "mindclade.orchestration.v1.WorkflowPublishedEvent": {
      "title": "Mindclade orchestration workflow publication event",
      "required": [
        "schema_version",
        "workflow_id",
        "name",
        "definition_digest",
        "workflow_schema_version",
        "stage_count"
      ],
      "fields": {
        "definition_digest": {"maxLength": 71, "pattern": "^sha256:[0-9a-f]{64}$"},
        "name": {"maxLength": 128, "minLength": 1},
        "schema_version": {"minimum": 1},
        "stage_count": {"maximum": 4096, "minimum": 1},
        "workflow_id": {"maxLength": 41, "pattern": "^workflow_[0-9a-f]{32}$"},
        "workflow_schema_version": {"minimum": 1}
      }
    }
  },
  "projections": [
    {
      "kind": "message",
      "message": "mindclade.events.v1.EventEnvelope",
      "path": "artifact/v1/event-envelope.schema.json"
    },
    {
      "kind": "message",
      "message": "mindclade.events.v1.EventEnvelope",
      "path": "data/v1/event-envelope.schema.json"
    },
    {
      "kind": "message",
      "message": "mindclade.events.v1.EventEnvelope",
      "path": "evaluation/v1/event-envelope.schema.json"
    },
    {
      "kind": "message",
      "message": "mindclade.events.v1.EventEnvelope",
      "path": "model/v1/event-envelope.schema.json"
    },
    {
      "kind": "message",
      "message": "mindclade.events.v1.EventEnvelope",
      "path": "orchestration/v1/event-envelope.schema.json"
    },
    {
      "kind": "message",
      "message": "mindclade.events.v1.EventEnvelope",
      "path": "runtime/v1/event-envelope.schema.json"
    },
    {
      "kind": "message",
      "message": "mindclade.events.v1.EventEnvelope",
      "path": "security/v1/event-envelope.schema.json"
    },
    {
      "kind": "message",
      "message": "mindclade.events.v1.EventEnvelope",
      "path": "training/v1/event-envelope.schema.json"
    },
    {
      "kind": "payload_union",
      "path": "artifact/v1/artifact-events.schema.json",
      "payload_messages": [],
      "title": "Mindclade artifact v1 domain event payloads"
    },
    {
      "kind": "payload_union",
      "path": "data/v1/data-events.schema.json",
      "payload_messages": [],
      "title": "Mindclade data v1 domain event payloads"
    },
    {
      "kind": "payload_union",
      "path": "evaluation/v1/evaluation-events.schema.json",
      "payload_messages": [],
      "title": "Mindclade evaluation v1 domain event payloads"
    },
    {
      "kind": "payload_union",
      "path": "model/v1/model-events.schema.json",
      "payload_messages": [],
      "title": "Mindclade model v1 domain event payloads"
    },
    {
      "kind": "payload_union",
      "path": "orchestration/v1/orchestration-events.schema.json",
      "payload_messages": [
        "mindclade.orchestration.v1.WorkflowPublishedEvent",
        "mindclade.orchestration.v1.StageStateEvent",
        "mindclade.orchestration.v1.AttemptStateEvent",
        "mindclade.orchestration.v1.CancellationRequestedEvent"
      ],
      "title": "Mindclade orchestration v1 domain event payloads"
    },
    {
      "kind": "payload_union",
      "path": "runtime/v1/runtime-events.schema.json",
      "payload_messages": [],
      "title": "Mindclade runtime v1 domain event payloads"
    },
    {
      "kind": "payload_union",
      "path": "security/v1/security-events.schema.json",
      "payload_messages": [],
      "title": "Mindclade security v1 domain event payloads"
    },
    {
      "kind": "payload_union",
      "path": "training/v1/training-events.schema.json",
      "payload_messages": [],
      "title": "Mindclade training v1 domain event payloads"
    }
  ]
}
