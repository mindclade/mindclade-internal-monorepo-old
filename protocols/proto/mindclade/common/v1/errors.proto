syntax = "proto3";

package mindclade.common.v1;

message ErrorsScaffold {
  option deprecated = true;
  string reserved = 1;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_PERMISSION_DENIED = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_CONFLICT = 5;
  ERROR_CODE_RESOURCE_EXHAUSTED = 6;
  ERROR_CODE_DEADLINE_EXCEEDED = 7;
  ERROR_CODE_UNAVAILABLE = 8;
  ERROR_CODE_INTERNAL = 9;
}

message FieldViolation {
  string field = 1;
  string description = 2;
}

message ErrorDetail {
  ErrorCode code = 1;
  string message = 2;
  string request_id = 3;
  repeated FieldViolation field_violations = 4;
  optional uint64 retry_after_millis = 5;
}
