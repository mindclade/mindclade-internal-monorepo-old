syntax = "proto3";

package mindclade.common.v1;

option go_package = "go.mindclade.dev/protocols/gen/go/mindclade/common/v1;commonv1";

// ResourceId is a tenant-scoped opaque identifier. Consumers must not infer
// storage location, tenancy, or lifecycle from its textual representation.
message ResourceId {
  string value = 1;
}

// ContentDigest identifies immutable bytes using an explicit algorithm.
message ContentDigest {
  string algorithm = 1;
  bytes value = 2;
}

// ResourceVersion supports optimistic concurrency without exposing database versions.
message ResourceVersion {
  string value = 1;
}
