syntax = "proto3";

package mindclade.common.v1;

option go_package = "go.mindclade.dev/protocols/gen/go/mindclade/common/v1;commonv1";

message PageRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message PageResponse {
  string next_page_token = 1;
}
