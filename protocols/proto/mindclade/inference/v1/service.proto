syntax = "proto3";

package mindclade.inference.v1;

option go_package = "go.mindclade.dev/protocols/gen/go/mindclade/inference/v1;inferencev1";

import "mindclade/inference/v1/request.proto";
import "mindclade/inference/v1/response.proto";
import "mindclade/inference/v1/stream.proto";

message PredictRequest {
  InferenceRequest request = 1;
}

message PredictResponse {
  InferenceResponse response = 1;
}

message StreamPredictRequest {
  InferenceRequest request = 1;
}

message StreamPredictResponse {
  InferenceStreamEvent event = 1;
}

service InferenceService {
  rpc Predict(PredictRequest) returns (PredictResponse);
  rpc StreamPredict(StreamPredictRequest) returns (stream StreamPredictResponse);
}
