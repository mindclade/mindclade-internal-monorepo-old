syntax = "proto3";

package mindclade.inference.v1;

option go_package = "go.mindclade.dev/protocols/gen/go/mindclade/inference/v1;inferencev1";

import "mindclade/common/v1/errors.proto";
import "mindclade/inference/v1/response.proto";

message InferenceAccepted { string request_id = 1; }
message InferenceProgress {
  double progress = 1;
  string stage = 2;
}

message InferenceStreamEvent {
  oneof event {
    InferenceAccepted accepted = 1;
    InferenceProgress progress = 2;
    InferenceResponse result = 3;
    mindclade.common.v1.ErrorDetail error = 4;
  }
}
