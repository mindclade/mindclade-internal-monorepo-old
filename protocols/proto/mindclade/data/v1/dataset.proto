syntax = "proto3";

package mindclade.data.v1;

import "google/protobuf/timestamp.proto";
import "mindclade/common/v1/identifiers.proto";

message DatasetScaffold {
  option deprecated = true;
  string reserved = 1;
}

enum DatasetStatus {
  DATASET_STATUS_UNSPECIFIED = 0;
  DATASET_STATUS_BUILDING = 1;
  DATASET_STATUS_READY = 2;
  DATASET_STATUS_DEPRECATED = 3;
  DATASET_STATUS_QUARANTINED = 4;
}

message Dataset {
  mindclade.common.v1.ResourceId id = 1;
  string name = 2;
  string version = 3;
  mindclade.common.v1.ContentDigest manifest_digest = 4;
  uint64 record_count = 5;
  uint64 size_bytes = 6;
  google.protobuf.Timestamp created_at = 7;
  DatasetStatus status = 8;
  string license = 9;
  string lineage_summary = 10;
}
