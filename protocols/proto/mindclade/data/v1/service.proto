syntax = "proto3";

package mindclade.data.v1;

option go_package = "go.mindclade.dev/protocols/gen/go/mindclade/data/v1;datav1";

import "mindclade/common/v1/identifiers.proto";
import "mindclade/common/v1/pagination.proto";
import "mindclade/data/v1/dataset.proto";

message ListDatasetsRequest { mindclade.common.v1.PageRequest page = 1; }
message ListDatasetsResponse {
  repeated Dataset datasets = 1;
  mindclade.common.v1.PageResponse page = 2;
}
message GetDatasetRequest { mindclade.common.v1.ResourceId dataset_id = 1; }
message GetDatasetResponse { Dataset dataset = 1; }

service DatasetService {
  rpc ListDatasets(ListDatasetsRequest) returns (ListDatasetsResponse);
  rpc GetDataset(GetDatasetRequest) returns (GetDatasetResponse);
}
