syntax = "proto3";

package mindclade.registry.v1;

option go_package = "go.mindclade.dev/protocols/gen/go/mindclade/registry/v1;registryv1";

import "mindclade/common/v1/identifiers.proto";
import "mindclade/common/v1/pagination.proto";
import "mindclade/registry/v1/model_bundle.proto";

message ListModelsRequest { mindclade.common.v1.PageRequest page = 1; }
message ListModelsResponse {
  repeated ModelBundle models = 1;
  mindclade.common.v1.PageResponse page = 2;
}
message GetModelRequest { mindclade.common.v1.ResourceId model_id = 1; }
message GetModelResponse { ModelBundle model = 1; }

service ModelRegistryService {
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc GetModel(GetModelRequest) returns (GetModelResponse);
}
