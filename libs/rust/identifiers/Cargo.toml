[package]
name = "mindclade_identifiers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Validated names and locally unique identifiers for Mindclade resources."
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
# src/digest.rs re-exports Digest from here (`pub use mindclade_content_digest::Digest;`), so
# the dependency is real and was simply never declared. Nothing caught it because the Rust
# workspace has not been compiled in CI.
mindclade_content_digest = { path = "../content_digest" }
mindclade_faults = { path = "../faults" }
mindclade_runtime_core = { path = "../runtime_core" }

[lints]
workspace = true
