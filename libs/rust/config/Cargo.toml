[package]
name = "mindclade_config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Strict, provenance-carrying service configuration for Rust processes."
publish = false

[lib]
crate-type = ["rlib"]

# No third-party dependencies. `content_digest` is the repository's SHA-256
# boundary and is already layer 0, so the snapshot digest reuses it rather than
# introducing a hashing dependency of its own. Everything else is std.
[dependencies]
mindclade_content_digest = { path = "../content_digest" }
mindclade_faults = { path = "../faults" }

[lints]
workspace = true
