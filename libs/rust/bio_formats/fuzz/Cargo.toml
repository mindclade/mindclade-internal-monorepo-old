[package]
name = "mindclade-bio-formats-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "LicenseRef-Mindclade-Proprietary"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mindclade_bio_formats = { path = ".." }
mindclade_bounded_parse = { path = "../../bounded_parse" }
# `Limits` ceilings are `ByteSize`, so deriving limits from fuzzer bytes needs
# the newtype. Path dependency on a first-party crate; nothing new enters the
# supply chain.
mindclade_bytes_io = { path = "../../bytes_io" }

# Shared harness support. `tools/qualification/rust/fuzz.py` enumerates `[[bin]]`
# entries only, so the lib is build support for the targets and never a target
# itself.
[lib]
name = "mindclade_bio_formats_fuzz"
path = "src/lib.rs"
# Unlike the targets, the lib is unit-tested: a `derive_limits` that emitted
# limits `Limits::validate` rejects would make every target silently fuzz
# nothing but the validator, and no fuzz run would ever report that.
test = true
doc = false
bench = false

[[bin]]
name = "fasta"
path = "fuzz_targets/fasta.rs"
test = false
doc = false
bench = false

[[bin]]
name = "a3m"
path = "fuzz_targets/a3m.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fastq"
path = "fuzz_targets/fastq.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stockholm"
path = "fuzz_targets/stockholm.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdb"
path = "fuzz_targets/pdb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mmcif"
path = "fuzz_targets/mmcif.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sdf"
path = "fuzz_targets/sdf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mol"
path = "fuzz_targets/mol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text_document"
path = "fuzz_targets/text_document.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
